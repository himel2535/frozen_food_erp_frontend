<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Activities — Toys Factory ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 font-['Inter'] antialiased text-slate-600">
  <div id="screen-workspace" class="min-h-screen flex">
    <app-sidebar mode="tenant"></app-sidebar>
    <main class="flex-1 flex flex-col min-h-screen overflow-hidden">
      <app-header mode="tenant" title="Enterprise Workspace"></app-header>

      <div id="crm-activities-main-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 flex flex-col">
        <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4">
          <div>
            <h2 class="text-xl font-extrabold text-slate-900 tracking-tight">CRM Activity Timeline & Task Reminders</h2>
            <p class="text-xs text-slate-500 mt-1 font-medium">Log follow-up touchpoints, record task reminders, and view global activity logs.</p>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <button onclick="window.openTimelineModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/10 flex items-center gap-2">
              <i data-lucide="plus" class="w-4 h-4"></i> Log Activity / Task
            </button>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <!-- Timeline Logs -->
          <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200/80 premium-shadow space-y-4">
            <h3 class="text-sm font-bold text-slate-900">Global Activity Timeline</h3>
            <div id="crm-global-timeline" class="space-y-4 divide-y divide-slate-100"></div>
          </div>

          <!-- Right: Tasks & Reminders -->
          <div class="bg-white p-6 rounded-2xl border border-slate-200/80 premium-shadow space-y-4 h-fit">
            <h3 class="text-sm font-bold text-slate-900">Outstanding Tasks</h3>
            <div id="crm-global-tasks" class="space-y-3"></div>
          </div>
        </div>
        
        <app-footer></app-footer>
      </div>

      <!-- LOG ACTIVITY MODAL -->
      <div id="modal-crm-timeline" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl p-6 border border-slate-200 relative my-8">
          <button onclick="toggleModal('modal-crm-timeline', false)" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-4 h-4"></i></button>
          <div class="mb-6 pr-8">
            <h3 class="text-sm font-bold text-slate-900">Log Activity / Task / Communication</h3>
            <p class="text-xs text-slate-500 mt-1">Add notes, reminders, tasks, or outbound communication logs.</p>
          </div>
          <form id="crm-timeline-form" onsubmit="window.handleTimelineSubmit(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs font-semibold text-slate-700">
            <div><label class="block mb-2">Customer <span class="text-rose-500">*</span></label><select id="crm-timeline-customer" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none"></select></div>
            <div><label class="block mb-2">Entry Type</label><select id="crm-timeline-type" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none"><option value="activity">Activity Note</option><option value="task">Task / Reminder</option><option value="communication">Communication Log</option></select></div>
            <div><label class="block mb-2">Subtype / Channel</label><input id="crm-timeline-subtype" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none" placeholder="call, meeting, whatsapp"></div>
            <div><label class="block mb-2">Due / Follow-up Date</label><input id="crm-timeline-date" type="date" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none"></div>
            <div class="md:col-span-2"><label class="block mb-2">Title / Subject <span class="text-rose-500">*</span></label><input id="crm-timeline-title" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none"></div>
            <div class="md:col-span-2"><label class="block mb-2">Summary</label><textarea id="crm-timeline-summary" rows="3" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none"></textarea></div>
            <div class="md:col-span-2 flex justify-end gap-3">
              <button type="button" onclick="toggleModal('modal-crm-timeline', false)" class="border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold px-4 py-2.5 rounded-xl transition-all">Cancel</button>
              <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/10">Save Entry</button>
            </div>
          </form>
        </div>
      </div>

    </main>
  </div>
  <script type="module" src="/layout.js"></script>
  <script type="module" src="/js/shared.js"></script>
  <script type="module" src="/js/crm-activities.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Center — Toys Factory ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 font-['Inter'] antialiased text-slate-600">
  <div id="screen-workspace" class="min-h-screen flex">
    <app-sidebar mode="tenant"></app-sidebar>
    <main class="flex-1 flex flex-col min-h-screen overflow-hidden">
      <app-header mode="tenant" title="System"></app-header>
      <div class="flex-1 overflow-y-auto p-6 md:p-8">
        
        <div id="notifications-main-view" class="max-w-4xl mx-auto flex flex-col gap-6">
          <section class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h2 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight"><span data-i18n="notifications.title">Notification Center</span></h2>
              <p class="text-xs text-slate-500 mt-1.5 font-medium">System alerts, inventory warnings, and payment reminders.</p>
            </div>
            <div class="flex items-center gap-3">
              <button onclick="window.markAllAsRead()" class="flex items-center gap-2 bg-slate-100 text-slate-700 px-4 py-2.5 rounded-xl font-bold text-xs hover:bg-slate-200 transition-colors cursor-pointer">
                <i data-lucide="check-check" class="w-4 h-4"></i> Mark All as Read
              </button>
            </div>
          </section>

          <section class="bg-white rounded-2xl border border-slate-200/80 premium-shadow flex flex-col overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4 bg-slate-50/50">
              <div class="flex items-center gap-2 w-full">
                <select id="notifications-filter-type" class="w-full sm:w-auto px-3 py-2 text-xs font-semibold text-slate-700 bg-white border border-slate-200 rounded-lg focus:outline-none" onchange="window.renderNotifications()">
                  <option value="all">All Alerts</option>
                  <option value="Inventory">Inventory Warnings</option>
                  <option value="Payment">Payment Due</option>
                  <option value="System">System Alerts</option>
                </select>
              </div>
            </div>
            <div class="divide-y divide-slate-100" id="notifications-list">
              <!-- JS Populated -->
            </div>
          </section>
        </div>

        <app-footer></app-footer>
      </div>
    </main>
  </div>

  <script type="module" src="/layout.js"></script>
  <script type="module" src="/js/shared.js"></script>
  <script type="module" src="/js/notifications.js"></script>
</body>
</html>

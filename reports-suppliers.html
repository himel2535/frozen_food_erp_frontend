<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supplier Reports — Toys Factory ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 font-['Inter'] antialiased text-slate-600">
  <div id="screen-workspace" class="min-h-screen flex">
    <app-sidebar mode="tenant"></app-sidebar>
    <main class="flex-1 flex flex-col min-h-screen overflow-hidden">
      <app-header mode="tenant" title="Enterprise Workspace"></app-header>

      <div class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 flex flex-col">
        <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4">
          <div>
            <h2 class="text-xl font-extrabold text-slate-900 tracking-tight"><span data-i18n="reports.suppliers_title">Supplier Reports</span></h2>
            <p class="text-xs text-slate-500 mt-1 font-medium">Analyze vendor spend and outstanding payables.</p>
          </div>
          <div class="flex gap-2">
            <button onclick="window.print()" class="bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-sm flex items-center gap-2 cursor-pointer">
              <i data-lucide="download" class="w-4 h-4"></i> Export PDF
            </button>
          </div>
        </div>

        <!-- Filters -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200/80 premium-shadow space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Search Supplier Name</label>
              <div class="relative">
                <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="filter-search" oninput="window.renderAll()" placeholder="Search..." class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 cursor-text">
              </div>
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Status</label>
              <select id="filter-status" onchange="window.renderAll()" class="w-full px-4 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/10 cursor-pointer appearance-none">
                <option value="All">All Statuses</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Metrics Section -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="report-metrics">
          <!-- Populated by JS -->
        </div>

        <!-- Table View -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200/80 premium-shadow">
          <div class="overflow-x-auto rounded-xl border border-slate-100">
            <table class="w-full text-left text-xs border-collapse whitespace-nowrap">
              <thead>
                <tr class="bg-slate-50 text-slate-500 border-b border-slate-100 font-bold">
                  <th class="p-4">Supplier Name</th>
                  <th class="p-4"><span data-i18n="common.status">Status</span></th>
                  <th class="p-4">Total POs</th>
                  <th class="p-4">Total Spend</th>
                  <th class="p-4">Outstanding Payables</th>
                  <th class="p-4 text-right">Last Order Date</th>
                </tr>
              </thead>
              <tbody id="report-body" class="divide-y divide-slate-100 font-medium text-slate-700">
                <!-- Rendered by JS -->
              </tbody>
            </table>
          </div>
        </div>

        <app-footer></app-footer>
      </div>
    </main>
  </div>

  <script type="module" src="/layout.js"></script>
  <script type="module" src="/js/shared.js"></script>
  <script type="module" src="/js/reports-suppliers.js"></script>
</body>
</html>

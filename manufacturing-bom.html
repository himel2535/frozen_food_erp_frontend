<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill of Materials (BOM) — Toys Factory ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 font-['Inter'] antialiased text-slate-600">
  <div id="screen-workspace" class="min-h-screen flex">
    <app-sidebar mode="tenant"></app-sidebar>
    <main class="flex-1 flex flex-col min-h-screen overflow-hidden">
      <app-header mode="tenant" title="Manufacturing"></app-header>
      <div class="flex-1 overflow-y-auto p-6 md:p-8">
        
        <!-- Main View (Table) -->
        <div id="bom-main-view" class="max-w-7xl mx-auto flex flex-col gap-6">
          <section class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h2 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight"><span data-i18n="manufacturing.bom_title">Bill of Materials (BOM)</span></h2>
              <p class="text-xs text-slate-500 mt-1.5 font-medium">Define product formulas, components, and material costs.</p>
            </div>
            <div class="flex items-center gap-3">
              <button onclick="window.openBomModal()" class="flex items-center gap-2 bg-blue-600 text-white px-4 py-2.5 rounded-xl font-bold text-xs shadow-sm hover:bg-blue-700 transition-colors cursor-pointer">
                <i data-lucide="plus" class="w-4 h-4"></i> Create New BOM
              </button>
            </div>
          </section>

          <!-- Metrics / KPI Row -->
          <section class="grid grid-cols-1 md:grid-cols-4 gap-4" id="bom-metrics">
            <!-- Rendered via JS -->
          </section>

          <section class="bg-white rounded-2xl border border-slate-200/80 premium-shadow flex flex-col overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4 bg-slate-50/50">
              <div class="relative w-full sm:w-72">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="bom-search-input" placeholder="Search BOM by ID, Name or Product..." class="w-full pl-9 pr-4 py-2 text-xs font-semibold text-slate-800 bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" oninput="window.renderTable()">
              </div>
              <div class="flex items-center gap-2 w-full sm:w-auto">
                <select id="bom-filter-status" class="w-full sm:w-auto px-3 py-2 text-xs font-semibold text-slate-700 bg-white border border-slate-200 rounded-lg focus:outline-none" onchange="window.renderTable()">
                  <option value="all">All Status</option>
                  <option value="Active">Active</option>
                  <option value="Archived">Archived</option>
                </select>
              </div>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs font-medium text-slate-600">
                <thead>
                  <tr class="bg-slate-50/80 border-b border-slate-100 text-[10px] uppercase font-bold text-slate-400/80 tracking-wider">
                    <th class="px-6 py-4">BOM ID</th>
                    <th class="px-6 py-4">BOM Name</th>
                    <th class="px-6 py-4">Target Product</th>
                    <th class="px-6 py-4 text-center">Items Count</th>
                    <th class="px-6 py-4 text-right">Est. Cost</th>
                    <th class="px-6 py-4"><span data-i18n="common.status">Status</span></th>
                    <th class="px-6 py-4 text-center"><span data-i18n="common.actions">Actions</span></th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100" id="bom-table-body">
                  <!-- JS Populated -->
                </tbody>
              </table>
            </div>
          </section>
        </div>

        <!-- Form View -->
        <div id="bom-form-view" class="max-w-4xl mx-auto hidden flex flex-col gap-6 relative">
          <app-form-header 
            title-id="bom-form-title" 
            title="Create Bill of Materials" 
            subtitle="Define the raw materials and components needed to manufacture a product." 
            back-action="window.showMainView()">
          </app-form-header>

          <form id="bom-form" onsubmit="window.handleSubmit(event)" class="flex flex-col gap-6">
            <input type="hidden" id="bom-edit-id">
            
            <section class="bg-white rounded-2xl border border-slate-200/80 premium-shadow p-6 flex flex-col gap-5">
              <h3 class="text-sm font-bold text-slate-900 flex items-center gap-2 border-b border-slate-100 pb-3">
                <i data-lucide="file-text" class="w-4 h-4 text-blue-600"></i> Primary Details
              </h3>
              
              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <label class="flex flex-col gap-1.5">
                  <span class="text-[11px] font-bold text-slate-700">BOM Name <span class="text-red-500">*</span></span>
                  <input type="text" id="bom-input-name" required class="px-3 py-2.5 text-xs font-semibold text-slate-900 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20" placeholder="e.g. Action Figure Assembly v1">
                </label>
                <label class="flex flex-col gap-1.5">
                  <span class="text-[11px] font-bold text-slate-700">Target Product (FG or Semi-FG) <span class="text-red-500">*</span></span>
                  <select id="bom-input-target-product" required class="px-3 py-2.5 text-xs font-semibold text-slate-900 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
                    <!-- Populated via JS -->
                  </select>
                </label>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                <label class="flex flex-col gap-1.5">
                  <span class="text-[11px] font-bold text-slate-700">Output Quantity <span class="text-red-500">*</span></span>
                  <input type="number" id="bom-input-output-qty" required min="1" value="1" class="px-3 py-2.5 text-xs font-semibold text-slate-900 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
                </label>
                <label class="flex flex-col gap-1.5">
                  <span class="text-[11px] font-bold text-slate-700">Status</span>
                  <select id="bom-input-status" class="px-3 py-2.5 text-xs font-semibold text-slate-900 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
                    <option value="Active">Active</option>
                    <option value="Archived">Archived</option>
                  </select>
                </label>
              </div>
            </section>

            <!-- Materials Section -->
            <section class="bg-white rounded-2xl border border-slate-200/80 premium-shadow flex flex-col p-6 gap-5">
              <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 class="text-sm font-bold text-slate-900 flex items-center gap-2">
                  <i data-lucide="layers" class="w-4 h-4 text-blue-600"></i> Materials & Components
                </h3>
                <button type="button" onclick="window.addMaterialRow()" class="text-[11px] font-bold text-blue-600 hover:text-blue-700 flex items-center gap-1 transition-colors bg-blue-50 px-3 py-1.5 rounded-lg cursor-pointer">
                  <i data-lucide="plus" class="w-3 h-3"></i> Add Material
                </button>
              </div>
              
              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs font-medium text-slate-600">
                  <thead>
                    <tr class="border-b border-slate-100 text-[10px] uppercase font-bold text-slate-400/80 tracking-wider">
                      <th class="py-2 pr-4 min-w-[200px]">Item</th>
                      <th class="py-2 px-4 w-32">Qty Needed</th>
                      <th class="py-2 px-4 text-right w-32">Cost / Unit</th>
                      <th class="py-2 pl-4 text-right w-32">Total Cost</th>
                      <th class="py-2 w-10"></th>
                    </tr>
                  </thead>
                  <tbody id="bom-materials-body" class="divide-y divide-slate-50">
                    <!-- Material Rows -->
                  </tbody>
                  <tfoot>
                    <tr class="border-t border-slate-200 bg-slate-50/50">
                      <td colspan="3" class="py-4 pr-4 text-right font-bold text-slate-700">Estimated Total Cost:</td>
                      <td class="py-4 pl-4 text-right font-extrabold text-blue-600 text-sm" id="bom-total-cost">$0.00</td>
                      <td></td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </section>

            <div class="flex items-center justify-end gap-3 pt-2">
              <button type="button" onclick="window.showMainView()" class="px-5 py-2.5 rounded-xl font-bold text-xs text-slate-600 bg-white border border-slate-200 hover:bg-slate-50 transition-colors shadow-sm cursor-pointer">Cancel</button>
              <button type="submit" class="px-6 py-2.5 rounded-xl font-bold text-xs text-white bg-blue-600 hover:bg-blue-700 shadow-md shadow-blue-500/20 transition-all cursor-pointer">Save BOM</button>
            </div>
          </form>
        </div>

        <app-footer></app-footer>
      </div>
    </main>
  </div>

  <script type="module" src="/layout.js"></script>
  <script type="module" src="/js/shared.js"></script>
  <script type="module" src="/js/manufacturing-bom.js"></script>
</body>
</html>

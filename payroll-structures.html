<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salary Structures — Toys Factory ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 font-['Inter'] antialiased text-slate-600">
  <div id="screen-workspace" class="min-h-screen flex">
    <app-sidebar mode="tenant"></app-sidebar>
    <main class="flex-1 flex flex-col min-h-screen overflow-hidden">
      <app-header mode="tenant" title="Enterprise Workspace"></app-header>

      <div id="payroll-structures-main-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 flex flex-col">
        <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4">
          <div>
            <h2 class="text-xl font-extrabold text-slate-900 tracking-tight"><span data-i18n="payroll.structures_title">Salary Structures</span></h2>
            <p class="text-xs text-slate-500 mt-1 font-medium">Define compensation templates for employees.</p>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <button onclick="window.openStructureModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/10 flex items-center gap-2 cursor-pointer">
              <i data-lucide="plus" class="w-4 h-4"></i> New Structure
            </button>
          </div>
        </div>

        <!-- Metrics Section -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="payroll-structures-metrics">
          <!-- Populated by JS -->
        </div>

        <!-- Filter Bar -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200/80 premium-shadow space-y-4">
          <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-3">
            <div class="text-xs text-slate-500 font-semibold">Filter and search operations.</div>
            <div class="relative min-w-[240px]">
              <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
              <input type="text" id="payroll-structures-search-input" oninput="window.renderTable()" placeholder="Search structures..." class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all font-medium cursor-text">
            </div>
          </div>
        </div>

        <!-- Table View -->
        <section id="payroll-structures-panel-list" class="space-y-4">
          <div class="bg-white p-4 rounded-2xl border border-slate-200/80 premium-shadow space-y-4">
            <div class="overflow-x-auto rounded-xl border border-slate-100">
              <table class="w-full text-left text-xs border-collapse whitespace-nowrap">
                <thead>
                  <tr class="bg-slate-50 text-slate-500 border-b border-slate-100 font-bold">
                    <th class="p-4">Structure Name</th>
                    <th class="p-4">Base Salary</th>
                    <th class="p-4">Total Allowances</th>
                    <th class="p-4">Total Deductions</th>
                    <th class="p-4">Net Package</th>
                    <th class="p-4"><span data-i18n="common.status">Status</span></th>
                    <th class="p-4 text-right"><span data-i18n="common.actions">Actions</span></th>
                  </tr>
                </thead>
                <tbody id="payroll-structures-body" class="divide-y divide-slate-100 font-medium text-slate-700">
                  <!-- Rendered by JS -->
                </tbody>
              </table>
            </div>
          </div>
        </section>

        <app-footer></app-footer>
      </div>

      <!-- Inline Form View -->
      <div id="payroll-structures-form-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 hidden bg-slate-50">
        <div class="max-w-4xl mx-auto w-full space-y-6">
          <app-form-header 
            title-id="structure-form-title"
            title="Create Salary Structure" 
            subtitle="Define a new compensation package." 
            back-action="window.showMainView()">
          </app-form-header>

          <form id="payroll-structures-form" onsubmit="window.handleSubmit(event)" class="bg-white rounded-2xl border border-slate-200 p-6 premium-shadow space-y-6 text-xs font-semibold text-slate-700">
            <!-- Basic Fields -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block mb-2 text-slate-600">Structure Name <span class="text-red-500">*</span></label>
                <input type="text" id="input-name" required placeholder="e.g. Senior Engineer Package" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-colors cursor-text">
              </div>
              <div>
                <label class="block mb-2 text-slate-600">Status <span class="text-red-500">*</span></label>
                <select id="input-status" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-colors cursor-pointer appearance-none">
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                </select>
              </div>
              <div class="md:col-span-2">
                <label class="block mb-2 text-slate-600">Base Salary (Monthly) <span class="text-red-500">*</span></label>
                <input type="number" id="input-base" required min="0" step="0.01" placeholder="0.00" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-colors cursor-text">
              </div>
            </div>

            <!-- Advanced Toggle -->
            <div class="pt-2">
              <button type="button" onclick="window.toggleAdvancedFields()" class="flex items-center gap-2 text-blue-600 hover:text-blue-700 text-xs font-bold transition-colors cursor-pointer">
                <i data-lucide="chevron-down" id="payroll-structures-advanced-icon" class="w-4 h-4 transition-transform"></i>
                Show Advanced Details (Allowances & Deductions)
              </button>
            </div>

            <!-- Advanced Fields -->
            <div id="payroll-structures-advanced-section" class="hidden space-y-6 pt-4 border-t border-slate-100">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Allowances -->
                <div class="space-y-4">
                  <h4 class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-2">Allowances</h4>
                  <div>
                    <label class="block mb-2 text-slate-600">House Rent Allowance (HRA)</label>
                    <input type="number" id="input-hra" min="0" step="0.01" value="0.00" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-colors cursor-text">
                  </div>
                  <div>
                    <label class="block mb-2 text-slate-600">Transport Allowance</label>
                    <input type="number" id="input-transport" min="0" step="0.01" value="0.00" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-colors cursor-text">
                  </div>
                  <div>
                    <label class="block mb-2 text-slate-600">Other Allowances</label>
                    <input type="number" id="input-other-allowance" min="0" step="0.01" value="0.00" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-colors cursor-text">
                  </div>
                </div>

                <!-- Deductions -->
                <div class="space-y-4">
                  <h4 class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-2">Deductions</h4>
                  <div>
                    <label class="block mb-2 text-slate-600">Standard Tax Deduction</label>
                    <input type="number" id="input-tax" min="0" step="0.01" value="0.00" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-colors cursor-text">
                  </div>
                  <div>
                    <label class="block mb-2 text-slate-600">Health Insurance</label>
                    <input type="number" id="input-insurance" min="0" step="0.01" value="0.00" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-colors cursor-text">
                  </div>
                  <div>
                    <label class="block mb-2 text-slate-600">Other Deductions</label>
                    <input type="number" id="input-other-deduction" min="0" step="0.01" value="0.00" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-colors cursor-text">
                  </div>
                </div>
              </div>
            </div>

            <!-- Form Actions -->
            <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
              <button type="button" onclick="window.showMainView()" class="border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold px-4 py-2.5 rounded-xl transition-all cursor-pointer">Cancel</button>
              <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/10 cursor-pointer flex items-center gap-2">
                <i data-lucide="save" class="w-4 h-4"></i> Save Structure
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/layout.js"></script>
  <script type="module" src="/js/shared.js"></script>
  <script type="module" src="/js/payroll-structures.js"></script>
</body>
</html>

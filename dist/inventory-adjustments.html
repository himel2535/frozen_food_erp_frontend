<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Adjustments — Toys Factory ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/inventory-adjustments-Cz7dwd2m.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/lucide-CU5-AOMs.js">
  <link rel="modulepreload" crossorigin href="/assets/shared-Det_SasC.js">
  <link rel="modulepreload" crossorigin href="/assets/layout-wQjH3XYy.js">
  <link rel="stylesheet" crossorigin href="/assets/lucide-bglkidLV.css">
</head>
<body class="bg-slate-50 font-['Inter'] antialiased text-slate-600">
  <div id="screen-workspace" class="min-h-screen flex">
    <app-sidebar mode="tenant"></app-sidebar>
    <main class="flex-1 flex flex-col min-h-screen overflow-hidden">
      <app-header mode="tenant" title="Enterprise Workspace"></app-header>

      <div id="inventory-adjustments-main-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 flex flex-col">
        <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4">
          <div>
            <h2 class="text-xl font-extrabold text-slate-900 tracking-tight"><span data-i18n="sidebar.adjustments">Stock Adjustments Master</span></h2>
            <p class="text-xs text-slate-500 mt-1 font-medium">Manage and track your business stock adjustments lifecycle.</p>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <button onclick="window.openAdjustmentModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/10 flex items-center gap-2 cursor-pointer">
              <i data-lucide="plus" class="w-4 h-4"></i> Add Adjustment
            </button>
          </div>
        </div>

        <!-- Metrics Section -->
        <div class="grid grid-cols-1 md:grid-cols-5 gap-4" id="inventory-adjustments-metrics">
          <!-- Populated by JS -->
        </div>

        <!-- Filter Bar -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200/80 premium-shadow space-y-4">
          <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-3">
            <div class="text-xs text-slate-500 font-semibold">Filter and search operations.</div>
            <div class="relative min-w-[240px]">
              <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
              <input type="text" id="inventory-adjustments-search-input" oninput="window.renderTable()" placeholder="Search..." class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all font-medium cursor-text">
            </div>
          </div>
        </div>

        <!-- Table View -->
        <section id="inventory-adjustments-panel-list" class="space-y-4">
          <div class="bg-white p-4 rounded-2xl border border-slate-200/80 premium-shadow space-y-4">
            <div class="overflow-x-auto rounded-xl border border-slate-100">
              <table class="w-full text-left text-xs border-collapse whitespace-nowrap">
                <thead>
                  <tr class="bg-slate-50 text-slate-500 border-b border-slate-100 font-bold">
                    <th class="p-4">ID</th>
                    <th class="p-4"><span data-i18n="common.product">Product</span></th>
                    <th class="p-4"><span data-i18n="common.warehouse">Warehouse</span></th>
                    <th class="p-4"><span data-i18n="common.type">Type</span></th>
                    <th class="p-4">Adj. Qty</th>
                    <th class="p-4">Unit Value</th>
                    <th class="p-4">Total Adj. Value</th>
                    <th class="p-4">Reason Code</th>
                    <th class="p-4"><span data-i18n="common.date">Date</span></th>
                    <th class="p-4"><span data-i18n="common.status">Status</span></th>
                    <th class="p-4 text-right"><span data-i18n="common.actions">Actions</span></th>
                  </tr>
                </thead>
                <tbody id="inventory-adjustments-body" class="divide-y divide-slate-100 font-medium text-slate-700">
                  <!-- Rendered by JS -->
                </tbody>
              </table>
            </div>
          </div>
        </section>

        <app-footer></app-footer>
      </div>

      <!-- Inline Form View -->
      <div id="inventory-adjustments-form-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 hidden bg-slate-50">
        <div class="max-w-4xl mx-auto w-full space-y-6">
          <app-form-header 
            title-id="adjustment-form-title"
            title="Create Adjustment" 
            subtitle="Provide details to record a stock adjustment." 
            back-action="window.showMainView()">
          </app-form-header>

          <form id="inventory-adjustments-form" onsubmit="window.handleSubmit(event)" class="bg-white rounded-2xl border border-slate-200 p-6 premium-shadow space-y-6 text-xs font-semibold text-slate-700">
            <!-- Basic Fields -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block mb-2 text-slate-600">Product <span class="text-red-500">*</span></label>
                <input type="text" id="input-prod" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-colors cursor-text" placeholder="e.g. Indigo Dye">
              </div>
              <div>
                <label class="block mb-2 text-slate-600">Warehouse <span class="text-red-500">*</span></label>
                <input type="text" id="input-wh" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-colors cursor-text" placeholder="e.g. Main Warehouse">
              </div>
              <div>
                <label class="block mb-2 text-slate-600">Adjustment Type <span class="text-red-500">*</span></label>
                <select id="input-type" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-colors cursor-pointer appearance-none">
                  <option value="Decrease">Decrease (-)</option>
                  <option value="Increase">Increase (+)</option>
                </select>
              </div>
              <div>
                <label class="block mb-2 text-slate-600">Quantity <span class="text-red-500">*</span></label>
                <input type="number" id="input-qty" required min="1" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-colors cursor-text" placeholder="Absolute value, e.g. 5">
              </div>
              <div>
                <label class="block mb-2 text-slate-600">Unit Value <span class="text-red-500">*</span></label>
                <input type="number" id="input-unit-value" required min="0" step="0.01" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-colors cursor-text" placeholder="0.00">
              </div>
              <div>
                <label class="block mb-2 text-slate-600">Date <span class="text-red-500">*</span></label>
                <input type="date" id="input-date" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-colors cursor-pointer">
              </div>
            </div>

            <!-- Advanced Toggle -->
            <div class="pt-2">
              <button type="button" onclick="window.toggleAdvancedFields()" class="flex items-center gap-2 text-blue-600 hover:text-blue-700 text-xs font-bold transition-colors cursor-pointer">
                <i data-lucide="chevron-down" id="inventory-adjustments-advanced-icon" class="w-4 h-4 transition-transform"></i>
                Show Advanced Details
              </button>
            </div>

            <!-- Advanced Fields -->
            <div id="inventory-adjustments-advanced-section" class="hidden space-y-6 pt-4 border-t border-slate-100">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label class="block mb-2 text-slate-600">Reason Code</label>
                  <select id="input-reason" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-colors cursor-pointer appearance-none">
                    <option value="">Select Reason...</option>
                    <option value="Shrinkage">Shrinkage / Loss</option>
                    <option value="Found Item">Found Item</option>
                    <option value="Damage">Damage</option>
                    <option value="Audit Miscount">Audit Miscount</option>
                    <option value="Expiry">Expiry</option>
                  </select>
                </div>
                <div>
                  <label class="block mb-2 text-slate-600">Reference Document</label>
                  <input type="text" id="input-ref" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-colors cursor-text" placeholder="e.g. AUD-2026-06">
                </div>
                <div class="md:col-span-2">
                  <label class="block mb-2 text-slate-600">Notes</label>
                  <textarea id="input-notes" rows="3" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-colors cursor-text resize-y" placeholder="Add optional details..."></textarea>
                </div>
              </div>
            </div>

            <!-- Form Actions -->
            <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
              <button type="button" onclick="window.showMainView()" class="border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold px-4 py-2.5 rounded-xl transition-all cursor-pointer">Cancel</button>
              <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/10 cursor-pointer flex items-center gap-2">
                <i data-lucide="save" class="w-4 h-4"></i> Save Record
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

</body>
</html>

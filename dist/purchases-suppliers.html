<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suppliers — Toys Factory ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/purchases-suppliers-SpiEkpdI.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/lucide-CU5-AOMs.js">
  <link rel="modulepreload" crossorigin href="/assets/shared-Det_SasC.js">
  <link rel="modulepreload" crossorigin href="/assets/layout-wQjH3XYy.js">
  <link rel="stylesheet" crossorigin href="/assets/lucide-bglkidLV.css">
</head>
<body class="bg-slate-50 font-['Inter'] antialiased text-slate-600">
  <div id="screen-workspace" class="min-h-screen flex">
    <app-sidebar mode="tenant"></app-sidebar>
    <main class="flex-1 flex flex-col min-h-screen overflow-hidden">
      <app-header mode="tenant" title="Enterprise Workspace"></app-header>

      <!-- Main view: list and directory of vendors -->
      <div id="purchases-suppliers-main-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 flex flex-col justify-between">
        <div class="space-y-6">
          <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4">
            <div>
              <h2 class="text-xl font-extrabold text-slate-900 tracking-tight"><span data-i18n="purchases.suppliers_title">Suppliers Directory</span></h2>
              <p class="text-xs text-slate-500 mt-1 font-medium">Manage raw material suppliers, vendor contacts, and lead performance.</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button onclick="window.openSupplierModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/10 flex items-center gap-2 cursor-pointer">
                <i data-lucide="plus" class="w-4 h-4"></i> Add Supplier
              </button>
            </div>
          </div>

          <!-- Metrics Widgets -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="purchases-suppliers-metrics">
            <!-- Populated dynamically -->
          </div>

          <!-- Filters & Search Bar -->
          <div class="bg-white p-4 rounded-2xl border border-slate-200/80 premium-shadow space-y-4">
            <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-3">
              <div class="text-xs text-slate-500 font-semibold">Filter and search operations.</div>
              <div class="relative min-w-[240px] w-full xl:w-auto">
                <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="purchases-suppliers-search-input" oninput="window.renderTable()" placeholder="Search supplier name, contact or phone..." class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all font-medium">
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <select id="filter-supplier-status" onchange="window.renderTable()" class="bg-slate-50 border border-slate-200 text-xs font-semibold text-slate-700 rounded-xl px-3 py-2 focus:outline-none cursor-pointer">
                <option value="all">All Statuses</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
              <select id="filter-supplier-rating" onchange="window.renderTable()" class="bg-slate-50 border border-slate-200 text-xs font-semibold text-slate-700 rounded-xl px-3 py-2 focus:outline-none cursor-pointer">
                <option value="all">All Ratings</option>
                <option value="4.5">4.5+ Rating</option>
                <option value="4.0">4.0+ Rating</option>
              </select>
              <select id="filter-supplier-terms" onchange="window.renderTable()" class="bg-slate-50 border border-slate-200 text-xs font-semibold text-slate-700 rounded-xl px-3 py-2 focus:outline-none cursor-pointer">
                <option value="all">All Payment Terms</option>
                <option value="Net 30">Net 30</option>
                <option value="Net 15">Net 15</option>
                <option value="Due on Receipt">Due on Receipt</option>
              </select>
            </div>
          </div>

          <!-- Suppliers List -->
          <section id="purchases-suppliers-panel-list" class="space-y-4">
            <div class="bg-white p-0 rounded-2xl border border-slate-200/80 premium-shadow overflow-hidden">
              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr class="bg-slate-50/85 text-slate-400 border-b border-slate-100 font-bold uppercase text-[10px] tracking-wider">
                      <th class="p-4 pl-6">Supplier ID</th>
                      <th class="p-4">Supplier Details</th>
                      <th class="p-4">Contact Person</th>
                      <th class="p-4"><span data-i18n="common.phone">Phone</span></th>
                      <th class="p-4 text-center">Avg Lead Time</th>
                      <th class="p-4">Payment Terms</th>
                      <th class="p-4 text-center">Rating</th>
                      <th class="p-4 text-center"><span data-i18n="common.status">Status</span></th>
                      <th class="p-4 text-center"><span data-i18n="common.actions">Actions</span></th>
                    </tr>
                  </thead>
                  <tbody id="purchases-suppliers-body" class="divide-y divide-slate-100 font-medium text-slate-700">
                    <!-- Rendered dynamically -->
                  </tbody>
                </table>
              </div>
            </div>
          </section>
        </div>

        <app-footer></app-footer>
      </div>

      <!-- Inline form layout: Add / Edit supplier details -->
      <div id="purchases-suppliers-form-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 hidden bg-slate-50">
        <div class="max-w-3xl mx-auto w-full space-y-6">
          <app-form-header title-id="supplier-form-title" title="Add Supplier" subtitle="Capture general details and performance metrics." back-action="window.showMainView()"></app-form-header>

          <form id="purchases-suppliers-form" onsubmit="window.handleSubmit(event)" class="bg-white rounded-2xl border border-slate-200 p-6 premium-shadow space-y-6 text-xs font-semibold text-slate-700">
            
            <!-- Basic Details -->
            <div class="space-y-4">
              <h3 class="text-sm font-bold text-slate-900 border-b border-slate-100 pb-2">Basic Details</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label class="block mb-2">Supplier / Vendor Name *</label>
                  <input type="text" id="input-supp-name" required placeholder="e.g. Apex Yarns Ltd" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none">
                </div>
                <div>
                  <label class="block mb-2">Contact Person *</label>
                  <input type="text" id="input-supp-contact" required placeholder="e.g. John Apex" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none">
                </div>
                <div>
                  <label class="block mb-2">Phone Number *</label>
                  <input type="text" id="input-supp-phone" required placeholder="e.g. +880 1711-556677" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none">
                </div>
                <div>
                  <label class="block mb-2">Status *</label>
                  <select id="input-supp-status" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none cursor-pointer">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Billing Details -->
            <div class="space-y-4">
              <h3 class="text-sm font-bold text-slate-900 border-b border-slate-100 pb-2">Billing & Procurement Details</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label class="block mb-2">Payment Terms *</label>
                  <select id="input-supp-terms" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none cursor-pointer">
                    <option value="Net 30">Net 30</option>
                    <option value="Net 15">Net 15</option>
                    <option value="Net 45">Net 45</option>
                    <option value="Net 60">Net 60</option>
                    <option value="Due on Receipt">Due on Receipt</option>
                  </select>
                </div>
                <div>
                  <label class="block mb-2">Average Lead Time (Days)</label>
                  <input type="text" id="input-supp-lead" placeholder="e.g. 7 Days" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none">
                </div>
              </div>
            </div>

            <!-- Advanced Details collapsible -->
            <div class="space-y-4 pt-2">
              <div>
                <button type="button" onclick="window.toggleAdvancedFields()" class="flex items-center gap-2 text-blue-600 hover:text-blue-700 text-xs font-bold transition-colors cursor-pointer">
                  <i data-lucide="chevron-down" id="supplier-advanced-icon" class="w-4 h-4 transition-transform"></i>
                  Show Advanced Details
                </button>
              </div>
              <div id="supplier-advanced-section" class="hidden space-y-6 pt-4 border-t border-slate-100">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label class="block mb-2">Email Address (Optional)</label>
                    <input type="email" id="input-supp-email" placeholder="sales@apexyarns.com" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none">
                  </div>
                  <div>
                    <label class="block mb-2">Vendor Rating (1.0 - 5.0)</label>
                    <input type="number" step="0.1" min="1" max="5" id="input-supp-rating" placeholder="4.5" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none">
                  </div>
                  <div class="md:col-span-2">
                    <label class="block mb-2">Street Address</label>
                    <input type="text" id="input-supp-address" placeholder="123 Industry Ave, Section 4" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none">
                  </div>
                  <div class="md:col-span-2">
                    <label class="block mb-2">Internal Vendor Notes</label>
                    <textarea id="input-supp-notes" placeholder="Agreements, pricing notes..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none h-14 resize-y"></textarea>
                  </div>
                </div>
              </div>
            </div>

            <!-- Form Actions -->
            <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
              <button type="button" onclick="window.showMainView()" class="border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold px-4 py-2.5 rounded-xl transition-all cursor-pointer">Cancel</button>
              <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/10 cursor-pointer">Save Record</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Permissions — Toys Factory ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/settings-permissions-DVZGu5Z8.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/lucide-CU5-AOMs.js">
  <link rel="modulepreload" crossorigin href="/assets/shared-Det_SasC.js">
  <link rel="modulepreload" crossorigin href="/assets/layout-wQjH3XYy.js">
  <link rel="stylesheet" crossorigin href="/assets/lucide-bglkidLV.css">
</head>
<body class="bg-slate-50 font-['Inter'] antialiased text-slate-600">
  <div id="screen-workspace" class="min-h-screen flex">
    <app-sidebar mode="tenant"></app-sidebar>
    <main class="flex-1 flex flex-col min-h-screen overflow-hidden">
      <app-header mode="tenant" title="Enterprise Workspace"></app-header>

      <!-- Main Permissions List View -->
      <div id="settings-permissions-main-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 flex flex-col justify-between">
        <div class="space-y-6">
          <!-- Page Header -->
          <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4">
            <div>
              <h2 class="text-xl font-extrabold text-slate-900 tracking-tight"><span data-i18n="settings.permissions_title">Permissions Master</span></h2>
              <p class="text-xs text-slate-500 mt-1 font-medium">Fine-tune system access constraints and authorization keys.</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button onclick="window.openPermissionForm()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/10 flex items-center gap-2 cursor-pointer">
                <i data-lucide="plus" class="w-4 h-4"></i> Add Permission
              </button>
            </div>
          </div>

          <!-- Metrics Section -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="settings-permissions-metrics">
            <!-- Populated by JS -->
          </div>

          <!-- Filter Bar -->
          <div class="bg-white p-4 rounded-2xl border border-slate-200/80 premium-shadow flex flex-col xl:flex-row xl:items-center xl:justify-between gap-3">
            <div class="text-xs text-slate-500 font-semibold">Filter and search permission keys.</div>
            <div class="relative min-w-[240px]">
              <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
              <input type="text" id="settings-permissions-search-input" oninput="window.renderTable()" placeholder="Search..." class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all font-medium">
            </div>
          </div>

          <!-- Table View -->
          <section id="settings-permissions-panel-list" class="space-y-4">
            <div class="bg-white rounded-2xl border border-slate-200/80 premium-shadow overflow-hidden">
              <div class="overflow-x-auto rounded-xl border border-slate-100">
                <table class="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr class="bg-slate-50 text-slate-500 border-b border-slate-100 font-bold">
                      <th class="p-4">ID</th>
                      <th class="p-4">Permission Key</th>
                      <th class="p-4">Scope / Workspace</th>
                      <th class="p-4">State</th>
                      <th class="p-4 text-right"><span data-i18n="common.actions">Actions</span></th>
                    </tr>
                  </thead>
                  <tbody id="settings-permissions-body" class="divide-y divide-slate-100 font-medium text-slate-700">
                    <!-- Rendered by JS -->
                  </tbody>
                </table>
              </div>
            </div>
          </section>
        </div>
        <app-footer></app-footer>
      </div>

      <!-- Inline Form View -->
      <div id="settings-permissions-form-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 hidden bg-slate-50">
        <div class="max-w-4xl mx-auto w-full space-y-6">
          <app-form-header title-id="permission-form-title" title="Create Permission" subtitle="Specify rule definition below." back-action="window.showMainView()"></app-form-header>

          <form id="settings-permissions-form" onsubmit="window.handlePermissionSubmit(event)" class="bg-white rounded-2xl border border-slate-200 p-6 premium-shadow space-y-6 text-xs font-semibold text-slate-700">
            <input type="hidden" id="input-permission-index">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-slate-600 mb-1.5 text-[11px] font-semibold">Permission Key <span class="text-red-500">*</span></label>
                <input type="text" id="input-key" required placeholder="e.g. inventory:replenish" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-medium">
              </div>
              <div>
                <label class="block text-slate-600 mb-1.5 text-[11px] font-semibold">Scope / Module <span class="text-red-500">*</span></label>
                <input type="text" id="input-scope" required placeholder="e.g. Inventory Control" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-medium">
              </div>
              <div>
                <label class="block text-slate-600 mb-1.5 text-[11px] font-semibold">State <span class="text-red-500">*</span></label>
                <select id="input-active" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer font-bold">
                  <option value="Enabled">Enabled</option>
                  <option value="Disabled">Disabled</option>
                </select>
              </div>
            </div>

            <!-- Advanced details toggle -->
            <div>
              <button type="button" onclick="window.toggleAdvancedFields()" class="flex items-center gap-2 text-blue-600 hover:text-blue-700 text-xs font-bold transition-colors cursor-pointer">
                <i data-lucide="chevron-down" id="settings-permissions-advanced-icon" class="w-4 h-4 transition-transform"></i>
                <span><span data-i18n="common.show_advanced">Show Advanced Details</span></span>
              </button>
            </div>

            <div id="settings-permissions-advanced-section" class="hidden space-y-4 pt-4 border-t border-slate-100">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label class="block text-slate-600 mb-1.5 text-[11px] font-semibold">Request Limit Override (Per Hour)</label>
                  <input type="number" id="input-limit" placeholder="e.g. 500" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-medium">
                </div>
                <div>
                  <label class="block text-slate-600 mb-1.5 text-[11px] font-semibold">IP Whitelist Constraint (Optional)</label>
                  <input type="text" id="input-ip" placeholder="e.g. 192.168.1.1/24" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-medium">
                </div>
              </div>
            </div>

            <!-- Form Actions -->
            <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
              <button type="button" onclick="window.showMainView()" class="border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold px-4 py-2.5 rounded-xl transition-all cursor-pointer">Cancel</button>
              <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/10 cursor-pointer">Save Permission</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toys Factory ERP - My Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/settings-profile-D6b5IUKF.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/lucide-CU5-AOMs.js">
  <link rel="modulepreload" crossorigin href="/assets/shared-Det_SasC.js">
  <link rel="modulepreload" crossorigin href="/assets/layout-wQjH3XYy.js">
  <link rel="stylesheet" crossorigin href="/assets/lucide-bglkidLV.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen overflow-x-hidden">
  <div class="flex h-screen overflow-hidden">
    <!-- Reusable Sidebar Component -->
    <app-sidebar mode="tenant"></app-sidebar>

    <main class="flex-1 flex flex-col min-h-screen overflow-hidden relative">
      <!-- Reusable Header Component -->
      <app-header mode="tenant" title="My Profile & Security"></app-header>

      <!-- Main Read-Only View -->
      <div id="settings-profile-main-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 flex flex-col relative z-0">
        <div class="max-w-5xl mx-auto w-full space-y-6">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-slate-200">
            <div>
              <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">My Profile</h2>
              <p class="text-xs text-slate-500 mt-1 font-medium">Manage your personal information, security, and preferences.</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="window.showProfileForm()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-md shadow-blue-500/20 cursor-pointer">
                <i data-lucide="edit-3" class="w-4 h-4"></i> Edit Profile
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Personal Info Card -->
            <div class="bg-white p-6 rounded-2xl border border-slate-200/80 premium-shadow space-y-4">
              <div class="flex items-center gap-4 pb-4 border-b border-slate-100">
                <div class="h-16 w-16 rounded-full bg-slate-700 flex items-center justify-center overflow-hidden shrink-0 shadow-md">
                  <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=100" class="h-full w-full object-cover" alt="Avatar">
                </div>
                <div>
                  <h3 class="text-sm font-bold text-slate-900" id="display-name">John Doe</h3>
                  <p class="text-xs text-blue-600 font-bold bg-blue-50 px-2 py-0.5 rounded-full inline-block mt-1">Administrator</p>
                </div>
              </div>
              <div class="space-y-3 text-xs">
                <div class="flex justify-between py-1.5 border-b border-slate-50 font-semibold">
                  <span class="text-slate-450">Email Address</span>
                  <span class="text-slate-800" id="display-email">admin@hookerp.com</span>
                </div>
                <div class="flex justify-between py-1.5 border-b border-slate-50 font-semibold">
                  <span class="text-slate-450">Phone Number</span>
                  <span class="text-slate-800" id="display-phone">+1 (555) 987-6543</span>
                </div>
                <div class="flex justify-between py-1.5 border-b border-slate-50 font-semibold">
                  <span class="text-slate-450">Department</span>
                  <span class="text-slate-800" id="display-department">Management</span>
                </div>
                <div class="flex justify-between py-1.5 border-b border-slate-50 font-semibold">
                  <span class="text-slate-450">Join Date</span>
                  <span class="text-slate-800">Jan 15, 2025</span>
                </div>
              </div>
            </div>

            <!-- Security & Password Card -->
            <div class="bg-white p-6 rounded-2xl border border-slate-200/80 premium-shadow space-y-4">
              <h3 class="text-xs font-bold text-slate-900 uppercase tracking-wider pb-2 border-b border-slate-100">Security & Password</h3>
              <div class="space-y-4 text-xs font-semibold pt-2">
                <div>
                  <label class="block text-slate-600 mb-1.5 text-[11px] font-semibold">Current Password</label>
                  <input type="password" value="********" disabled class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs text-slate-500">
                </div>
                <div>
                  <label class="block text-slate-600 mb-1.5 text-[11px] font-semibold">Two-Factor Authentication (2FA)</label>
                  <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <div class="flex items-center gap-2">
                      <div class="w-2 h-2 rounded-full bg-rose-500"></div>
                      <span class="text-slate-700">Currently Disabled</span>
                    </div>
                    <button class="text-blue-600 hover:text-blue-700 text-[11px] font-bold">Enable 2FA</button>
                  </div>
                </div>
                <div class="pt-2">
                  <button class="w-full border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-bold py-2.5 rounded-xl transition-all cursor-pointer">
                    Change Password
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <app-footer></app-footer>
      </div>

      <!-- Inline Form View -->
      <div id="settings-profile-form-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 hidden bg-slate-50">
        <div class="max-w-4xl mx-auto w-full space-y-6">
          <app-form-header title="Edit Profile" subtitle="Update your personal information." back-action="window.showMainView()"></app-form-header>

          <form id="settings-profile-form" onsubmit="window.handleProfileSubmit(event)" class="bg-white rounded-2xl border border-slate-200 p-6 premium-shadow space-y-6 text-xs font-semibold text-slate-700">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-slate-600 mb-1.5 text-[11px] font-semibold">Full Name <span class="text-red-500">*</span></label>
                <input type="text" id="input-name" required value="John Doe" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-medium">
              </div>
              <div>
                <label class="block text-slate-600 mb-1.5 text-[11px] font-semibold">Email Address <span class="text-red-500">*</span></label>
                <input type="email" id="input-email" required value="admin@hookerp.com" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-medium">
              </div>
              <div>
                <label class="block text-slate-600 mb-1.5 text-[11px] font-semibold">Phone Number</label>
                <input type="tel" id="input-phone" value="+1 (555) 987-6543" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-medium">
              </div>
              <div>
                <label class="block text-slate-600 mb-1.5 text-[11px] font-semibold">Department</label>
                <input type="text" id="input-department" value="Management" disabled class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-100 text-xs text-slate-500 focus:outline-none transition-all font-medium">
              </div>
            </div>

            <!-- Form Actions -->
            <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
              <button type="button" onclick="window.showMainView()" class="border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold px-4 py-2.5 rounded-xl transition-all cursor-pointer">Cancel</button>
              <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/10 cursor-pointer">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Point of Sale (POS) — Toys Factory ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/sales-pos-CezfVIzT.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/lucide-CU5-AOMs.js">
  <link rel="modulepreload" crossorigin href="/assets/shared-Det_SasC.js">
  <link rel="modulepreload" crossorigin href="/assets/layout-wQjH3XYy.js">
  <link rel="stylesheet" crossorigin href="/assets/lucide-bglkidLV.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans h-screen overflow-hidden">
  <div class="flex h-screen overflow-hidden">
    <!-- Reusable Sidebar Component -->
    <app-sidebar mode="tenant"></app-sidebar>

    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
      <!-- Reusable Header Component -->
      <app-header mode="tenant" title="Point of Sale" data-i18n-title="sales.pos_title"></app-header>

      <!-- POS Main Layout -->
      <div class="flex-1 flex flex-col lg:flex-row h-full overflow-hidden">
        
        <!-- Left Side: Product Grid -->
        <div class="flex-1 flex flex-col bg-slate-50 border-r border-slate-200">
          <!-- Search & Filter Bar -->
          <div class="p-4 bg-white border-b border-slate-200 flex items-center gap-4">
            <div class="relative flex-1">
              <i data-lucide="barcode" class="w-5 h-5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
              <input type="text" id="pos-search" data-i18n="inventory.search_placeholder" placeholder="Scan Barcode or Search Products..." class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-bold">
            </div>
            <select class="px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 cursor-pointer font-bold w-48 hidden md:block">
              <option value="" data-i18n="inventory.all_categories">All Categories</option>
              <option value="Finished Goods">Finished Goods</option>
              <option value="Accessories">Accessories</option>
            </select>
          </div>

          <!-- Product Grid -->
          <div class="flex-1 overflow-y-auto p-4">
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="pos-product-grid">
              <!-- Populated by JS -->
            </div>
          </div>
        </div>

        <!-- Right Side: Cart / Checkout -->
        <div class="w-full lg:w-96 bg-white flex flex-col shadow-xl z-10">
          
          <!-- Customer Selection -->
          <div class="p-4 border-b border-slate-100 bg-slate-50">
            <div class="flex items-center gap-2 mb-2">
              <i data-lucide="user" class="w-4 h-4 text-slate-400"></i>
              <span class="text-xs font-bold text-slate-600">Customer</span>
            </div>
            <div class="flex items-center gap-2">
              <select id="pos-customer" class="flex-1 px-3 py-2 rounded-xl border border-slate-200 bg-white text-xs font-bold focus:outline-none focus:ring-2 focus:ring-blue-500/20 cursor-pointer">
                <option value="Walk-in Customer">Walk-in Customer</option>
                <option value="Acme Corp">Acme Corp</option>
                <option value="TechStart LLC">TechStart LLC</option>
              </select>
              <button class="bg-blue-50 hover:bg-blue-100 text-blue-600 p-2 rounded-xl transition-colors cursor-pointer"><i data-lucide="user-plus" class="w-4 h-4"></i></button>
            </div>
          </div>

          <!-- Cart Items -->
          <div class="flex-1 overflow-y-auto p-2 space-y-2" id="pos-cart-items">
            <!-- Populated by JS -->
            <div class="flex flex-col items-center justify-center h-full text-slate-400 opacity-50" id="pos-empty-cart">
              <i data-lucide="shopping-bag" class="w-12 h-12 mb-3"></i>
              <span class="text-sm font-bold">Cart is empty</span>
            </div>
          </div>

          <!-- Totals & Checkout -->
          <div class="p-4 border-t border-slate-200 bg-white space-y-3">
            <div class="flex justify-between text-sm font-bold text-slate-500">
              <span>Subtotal</span>
              <span id="pos-subtotal">$0.00</span>
            </div>
            <div class="flex justify-between text-sm font-bold text-slate-500">
              <span>Tax (5%)</span>
              <span id="pos-tax">$0.00</span>
            </div>
            <div class="flex justify-between text-xl font-extrabold text-slate-900 border-t border-slate-100 pt-3">
              <span>Total</span>
              <span id="pos-total">$0.00</span>
            </div>
            
            <div class="grid grid-cols-2 gap-2 pt-2">
              <button onclick="window.clearCart()" class="py-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 font-bold transition-colors cursor-pointer text-sm">Hold / Clear</button>
              <button onclick="window.checkout()" class="py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold transition-all shadow-md shadow-blue-500/20 cursor-pointer text-sm flex items-center justify-center gap-2">
                <i data-lucide="credit-card" class="w-4 h-4"></i> Pay Now
              </button>
            </div>
          </div>

        </div>

      </div>
    </main>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roles — Toys Factory ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/settings-roles-PaLhBgFb.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/lucide-CU5-AOMs.js">
  <link rel="modulepreload" crossorigin href="/assets/shared-Det_SasC.js">
  <link rel="modulepreload" crossorigin href="/assets/layout-wQjH3XYy.js">
  <link rel="stylesheet" crossorigin href="/assets/lucide-bglkidLV.css">
</head>
<body class="bg-slate-50 font-['Inter'] antialiased text-slate-600">
  <div id="screen-workspace" class="min-h-screen flex">
    <app-sidebar mode="tenant"></app-sidebar>
    <main class="flex-1 flex flex-col min-h-screen overflow-hidden">
      <app-header mode="tenant" title="Enterprise Workspace"></app-header>

      <!-- Main Roles List View -->
      <div id="settings-roles-main-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 flex flex-col justify-between">
        <div class="space-y-6">
          <!-- Page Header -->
          <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4">
            <div>
              <h2 class="text-xl font-extrabold text-slate-900 tracking-tight"><span data-i18n="settings.roles_title">Roles Master</span></h2>
              <p class="text-xs text-slate-500 mt-1 font-medium">Configure authorization boundaries and security hierarchies.</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button onclick="window.openRoleForm()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/10 flex items-center gap-2 cursor-pointer">
                <i data-lucide="plus" class="w-4 h-4"></i> Add Role
              </button>
            </div>
          </div>

          <!-- Metrics Section -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="settings-roles-metrics">
            <!-- Populated by JS -->
          </div>

          <!-- Filter Bar -->
          <div class="bg-white p-4 rounded-2xl border border-slate-200/80 premium-shadow flex flex-col xl:flex-row xl:items-center xl:justify-between gap-3">
            <div class="text-xs text-slate-500 font-semibold">Filter and search role definitions.</div>
            <div class="relative min-w-[240px]">
              <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
              <input type="text" id="settings-roles-search-input" oninput="window.renderTable()" placeholder="Search roles..." class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all font-medium">
            </div>
          </div>

          <!-- Table View -->
          <section id="settings-roles-panel-list" class="space-y-4">
            <div class="bg-white rounded-2xl border border-slate-200/80 premium-shadow overflow-hidden">
              <div class="overflow-x-auto rounded-xl border border-slate-100">
                <table class="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr class="bg-slate-50 text-slate-500 border-b border-slate-100 font-bold">
                      <th class="p-4">ID</th>
                      <th class="p-4">Role Name</th>
                      <th class="p-4"><span data-i18n="common.category">Category</span></th>
                      <th class="p-4">Description</th>
                      <th class="p-4">Associated Users</th>
                      <th class="p-4 text-right"><span data-i18n="common.actions">Actions</span></th>
                    </tr>
                  </thead>
                  <tbody id="settings-roles-body" class="divide-y divide-slate-100 font-medium text-slate-700">
                    <!-- Rendered by JS -->
                  </tbody>
                </table>
              </div>
            </div>
          </section>
        </div>
        <app-footer></app-footer>
      </div>

      <!-- Inline Form View -->
      <div id="settings-roles-form-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 hidden bg-slate-50">
        <div class="max-w-4xl mx-auto w-full space-y-6">
          <app-form-header title-id="role-form-title" title="Create Role" subtitle="Define permission groups for credentials assignment." back-action="window.showMainView()"></app-form-header>

          <form id="settings-roles-form" onsubmit="window.handleRoleSubmit(event)" class="bg-white rounded-2xl border border-slate-200 p-6 premium-shadow space-y-6 text-xs font-semibold text-slate-700">
            <input type="hidden" id="input-role-index">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-slate-600 mb-1.5 text-[11px] font-semibold">Role Name <span class="text-red-500">*</span></label>
                <input type="text" id="input-name" required placeholder="e.g. Finance Auditor" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-medium">
              </div>
              <div>
                <label class="block text-slate-600 mb-1.5 text-[11px] font-semibold">Role Category <span class="text-red-500">*</span></label>
                <select id="input-category" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer font-bold">
                  <option value="Security">Security</option>
                  <option value="Executive">Executive</option>
                  <option value="Operations">Operations</option>
                  <option value="Finance">Finance</option>
                  <option value="Staff">Staff</option>
                </select>
              </div>
              <div class="md:col-span-2">
                <label class="block text-slate-600 mb-1.5 text-[11px] font-semibold">Description</label>
                <textarea id="input-desc" rows="2" placeholder="Brief outline of this role's business functions..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all resize-none font-medium"></textarea>
              </div>
            </div>

            <!-- Advanced Toggles -->
            <div>
              <button type="button" onclick="window.toggleAdvancedFields()" class="flex items-center gap-2 text-blue-600 hover:text-blue-700 text-xs font-bold transition-colors cursor-pointer">
                <i data-lucide="chevron-down" id="settings-roles-advanced-icon" class="w-4 h-4 transition-transform"></i>
                <span><span data-i18n="common.show_advanced">Show Advanced Details</span></span>
              </button>
            </div>

            <div id="settings-roles-advanced-section" class="hidden space-y-4 pt-4 border-t border-slate-100">
              <span class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">Module Access Grants</span>
              <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                <label class="flex items-center gap-3 p-3 border border-slate-100 rounded-xl hover:bg-slate-50 transition-all cursor-pointer">
                  <input type="checkbox" id="grant-crm" class="rounded border-slate-200 text-blue-600 focus:ring-blue-500/25 h-4.5 w-4.5 cursor-pointer">
                  <div>
                    <span class="text-xs font-bold text-slate-900 block">CRM Module</span>
                    <span class="text-[9px] text-slate-400 block font-semibold">Leads & Customers</span>
                  </div>
                </label>
                <label class="flex items-center gap-3 p-3 border border-slate-100 rounded-xl hover:bg-slate-50 transition-all cursor-pointer">
                  <input type="checkbox" id="grant-inventory" class="rounded border-slate-200 text-blue-600 focus:ring-blue-500/25 h-4.5 w-4.5 cursor-pointer">
                  <div>
                    <span class="text-xs font-bold text-slate-900 block">Inventory</span>
                    <span class="text-[9px] text-slate-400 block font-semibold">Stock control</span>
                  </div>
                </label>
                <label class="flex items-center gap-3 p-3 border border-slate-100 rounded-xl hover:bg-slate-50 transition-all cursor-pointer">
                  <input type="checkbox" id="grant-sales" class="rounded border-slate-200 text-blue-600 focus:ring-blue-500/25 h-4.5 w-4.5 cursor-pointer">
                  <div>
                    <span class="text-xs font-bold text-slate-900 block">Sales & Billing</span>
                    <span class="text-[9px] text-slate-400 block font-semibold">Invoices & Quotes</span>
                  </div>
                </label>
                <label class="flex items-center gap-3 p-3 border border-slate-100 rounded-xl hover:bg-slate-50 transition-all cursor-pointer">
                  <input type="checkbox" id="grant-hrm" class="rounded border-slate-200 text-blue-600 focus:ring-blue-500/25 h-4.5 w-4.5 cursor-pointer">
                  <div>
                    <span class="text-xs font-bold text-slate-900 block">HR Directory</span>
                    <span class="text-[9px] text-slate-400 block font-semibold">Employees list</span>
                  </div>
                </label>
                <label class="flex items-center gap-3 p-3 border border-slate-100 rounded-xl hover:bg-slate-50 transition-all cursor-pointer">
                  <input type="checkbox" id="grant-purchases" class="rounded border-slate-200 text-blue-600 focus:ring-blue-500/25 h-4.5 w-4.5 cursor-pointer">
                  <div>
                    <span class="text-xs font-bold text-slate-900 block">Purchases</span>
                    <span class="text-[9px] text-slate-400 block font-semibold">POs & Suppliers</span>
                  </div>
                </label>
                <label class="flex items-center gap-3 p-3 border border-slate-100 rounded-xl hover:bg-slate-50 transition-all cursor-pointer">
                  <input type="checkbox" id="grant-accounting" class="rounded border-slate-200 text-blue-600 focus:ring-blue-500/25 h-4.5 w-4.5 cursor-pointer">
                  <div>
                    <span class="text-xs font-bold text-slate-900 block">Accounting</span>
                    <span class="text-[9px] text-slate-400 block font-semibold">Ledgers & Journals</span>
                  </div>
                </label>
              </div>
            </div>

            <!-- Form Actions -->
            <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
              <button type="button" onclick="window.showMainView()" class="border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold px-4 py-2.5 rounded-xl transition-all cursor-pointer">Cancel</button>
              <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/10 cursor-pointer">Save Role</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

</body>
</html>

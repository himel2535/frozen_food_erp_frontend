<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Bills — Toys Factory ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/purchases-bills-DvaYXoCU.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/lucide-CU5-AOMs.js">
  <link rel="modulepreload" crossorigin href="/assets/shared-Det_SasC.js">
  <link rel="modulepreload" crossorigin href="/assets/layout-wQjH3XYy.js">
  <link rel="stylesheet" crossorigin href="/assets/lucide-bglkidLV.css">
</head>
<body class="bg-slate-50 font-['Inter'] antialiased text-slate-600">
  <div id="screen-workspace" class="min-h-screen flex">
    <app-sidebar mode="tenant"></app-sidebar>
    <main class="flex-1 flex flex-col min-h-screen overflow-hidden">
      <app-header mode="tenant" title="Enterprise Workspace"></app-header>

      <!-- List View -->
      <div id="purchases-bills-main-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 flex flex-col justify-between">
        <div class="space-y-6">
          <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4">
            <div>
              <h2 class="text-xl font-extrabold text-slate-900 tracking-tight"><span data-i18n="purchases.bills_title">Vendor Bills Master</span></h2>
              <p class="text-xs text-slate-500 mt-1 font-medium">Manage and track your business vendor invoices and accounts payable records.</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button onclick="window.openBillModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/10 flex items-center gap-2 cursor-pointer">
                <i data-lucide="plus" class="w-4 h-4"></i> Add Vendor Bill
              </button>
            </div>
          </div>

          <!-- Metrics Widgets -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="purchases-bills-metrics">
            <!-- Populated dynamically -->
          </div>

          <!-- Filters & Search Bar -->
          <div class="bg-white p-4 rounded-2xl border border-slate-200/80 premium-shadow space-y-4">
            <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-3">
              <div class="text-xs text-slate-500 font-semibold">Filter and search vendor bills.</div>
              <div class="relative min-w-[240px] w-full xl:w-auto">
                <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="purchases-bills-search-input" oninput="window.renderTable()" placeholder="Search Bill No, Supplier, PO Ref..." class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all font-medium">
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
              <select id="filter-supplier" onchange="window.renderTable()" class="bg-slate-50 border border-slate-200 text-xs font-semibold text-slate-700 rounded-xl px-3 py-2 focus:outline-none cursor-pointer">
                <option value="all">All Suppliers</option>
              </select>
              <select id="filter-status" onchange="window.renderTable()" class="bg-slate-50 border border-slate-200 text-xs font-semibold text-slate-700 rounded-xl px-3 py-2 focus:outline-none cursor-pointer">
                <option value="all">All Statuses</option>
                <option value="Pending">Pending Approval</option>
                <option value="Approved">Approved (Unpaid)</option>
                <option value="Paid">Paid</option>
              </select>
              <div class="flex items-center gap-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
                <span class="text-[10px] text-slate-400 font-bold uppercase whitespace-nowrap">From:</span>
                <input type="date" id="filter-date-start" onchange="window.renderTable()" class="bg-transparent border-none text-xs font-semibold text-slate-700 w-full focus:outline-none">
              </div>
              <div class="flex items-center gap-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
                <span class="text-[10px] text-slate-400 font-bold uppercase whitespace-nowrap">To:</span>
                <input type="date" id="filter-date-end" onchange="window.renderTable()" class="bg-transparent border-none text-xs font-semibold text-slate-700 w-full focus:outline-none">
              </div>
            </div>
          </div>

          <!-- Bills Table View -->
          <section id="purchases-bills-panel-list" class="space-y-4">
            <div class="bg-white p-0 rounded-2xl border border-slate-200/80 premium-shadow overflow-hidden">
              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr class="bg-slate-50/85 text-slate-400 border-b border-slate-100 font-bold uppercase text-[10px] tracking-wider">
                      <th class="p-4 pl-6">Bill No</th>
                      <th class="p-4">Supplier</th>
                      <th class="p-4">PO Ref</th>
                      <th class="p-4">Bill Date</th>
                      <th class="p-4">Due Date</th>
                      <th class="p-4 text-right">Tax (%)</th>
                      <th class="p-4 text-right">Total Amount</th>
                      <th class="p-4 text-center"><span data-i18n="common.status">Status</span></th>
                      <th class="p-4 text-center"><span data-i18n="common.actions">Actions</span></th>
                    </tr>
                  </thead>
                  <tbody id="purchases-bills-body" class="divide-y divide-slate-100 font-medium text-slate-700">
                    <!-- Rendered dynamically -->
                  </tbody>
                </table>
              </div>
            </div>
          </section>
        </div>

        <app-footer></app-footer>
      </div>

      <!-- Inline form view: Add/Edit Bills details -->
      <div id="purchases-bills-form-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 hidden bg-slate-50">
        <div class="max-w-3xl mx-auto w-full space-y-6">
          <app-form-header title-id="bill-form-title" title="Create Vendor Bill" subtitle="Record accounts payable liability details." back-action="window.showMainView()"></app-form-header>

          <form id="purchases-bills-form" onsubmit="window.handleSubmit(event)" class="bg-white rounded-2xl border border-slate-200 p-6 premium-shadow space-y-6 text-xs font-semibold text-slate-700">
            
            <!-- Basic Details -->
            <div class="space-y-4">
              <h3 class="text-sm font-bold text-slate-900 border-b border-slate-100 pb-2">Bill Overview</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label class="block mb-2">Supplier *</label>
                  <select id="input-supp" required onchange="window.handleSupplierChange()" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none cursor-pointer">
                    <option value="">Select Supplier</option>
                  </select>
                </div>
                <div>
                  <label class="block mb-2">Link Purchase Order</label>
                  <select id="input-po-ref" onchange="window.handlePOChange()" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none cursor-pointer">
                    <option value="">Select Purchase Order (Optional)</option>
                  </select>
                </div>
                <div>
                  <label class="block mb-2">Bill Date *</label>
                  <input type="date" id="input-date" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none">
                </div>
                <div>
                  <label class="block mb-2">Due Date *</label>
                  <input type="date" id="input-due-date" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none">
                </div>
              </div>
            </div>

            <!-- Costing details -->
            <div class="space-y-4">
              <h3 class="text-sm font-bold text-slate-900 border-b border-slate-100 pb-2">Amounts & Taxes</h3>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                  <label class="block mb-2">Subtotal Amount ($) *</label>
                  <input type="number" step="0.01" min="0" id="input-subtotal" required oninput="window.calculateTotal()" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none">
                </div>
                <div>
                  <label class="block mb-2">Tax Rate (%)</label>
                  <input type="number" min="0" max="100" id="input-tax-rate" value="5" oninput="window.calculateTotal()" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none">
                </div>
                <div>
                  <label class="block mb-2">Total Amount ($)</label>
                  <input type="text" id="input-total" readonly class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-100 text-xs text-slate-500 font-bold focus:outline-none">
                </div>
              </div>
            </div>

            <!-- Advanced details Collapsible -->
            <div class="space-y-4 pt-2">
              <div>
                <button type="button" onclick="window.toggleAdvancedFields()" class="flex items-center gap-2 text-blue-600 hover:text-blue-700 text-xs font-bold transition-colors cursor-pointer">
                  <i data-lucide="chevron-down" id="bill-advanced-icon" class="w-4 h-4 transition-transform"></i>
                  Show Advanced Details
                </button>
              </div>
              <div id="bill-advanced-section" class="hidden space-y-6 pt-4 border-t border-slate-100">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label class="block mb-2">Supplier Payment Terms</label>
                    <input type="text" id="input-terms" placeholder="e.g. Net 30" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none">
                  </div>
                  <div>
                    <label class="block mb-2">Billing Street Address</label>
                    <input type="text" id="input-billing-address" placeholder="e.g. Tehran, Iran" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none">
                  </div>
                  <div class="md:col-span-2">
                    <label class="block mb-2">Internal Notes</label>
                    <textarea id="input-notes" placeholder="Invoice descriptions, custom receipt parameters..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none h-14 resize-y"></textarea>
                  </div>
                </div>
              </div>
            </div>

            <!-- Form Actions -->
            <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
              <button type="button" onclick="window.showMainView()" class="border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold px-4 py-2.5 rounded-xl transition-all cursor-pointer">Cancel</button>
              <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/10 cursor-pointer">Save Record</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

</body>
</html>

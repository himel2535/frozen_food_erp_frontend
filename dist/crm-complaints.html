<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Complaints — Toys Factory ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/crm-complaints-AwSaIhv3.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/lucide-CU5-AOMs.js">
  <link rel="modulepreload" crossorigin href="/assets/shared-Det_SasC.js">
  <link rel="modulepreload" crossorigin href="/assets/layout-wQjH3XYy.js">
  <link rel="stylesheet" crossorigin href="/assets/lucide-bglkidLV.css">
</head>
<body class="bg-slate-50 font-['Inter'] antialiased text-slate-600">
  <div id="screen-workspace" class="min-h-screen flex">
    <app-sidebar mode="tenant"></app-sidebar>
    <main class="flex-1 flex flex-col min-h-screen overflow-hidden">
      <app-header mode="tenant" title="CRM"></app-header>
      <div class="flex-1 overflow-y-auto p-6 md:p-8">
        
        <!-- Main View (Table) -->
        <div id="complaints-main-view" class="max-w-7xl mx-auto flex flex-col gap-6">
          <section class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h2 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight"><span data-i18n="crm.complaints_title">Customer Complaints</span></h2>
              <p class="text-xs text-slate-500 mt-1.5 font-medium">Track customer feedback, quality issues, and resolution workflows.</p>
            </div>
            <div class="flex items-center gap-3">
              <button onclick="window.openComplaintModal()" class="flex items-center gap-2 bg-purple-600 text-white px-4 py-2.5 rounded-xl font-bold text-xs shadow-sm hover:bg-purple-700 transition-colors cursor-pointer">
                <i data-lucide="message-square-warning" class="w-4 h-4"></i> Log Complaint
              </button>
            </div>
          </section>

          <!-- Metrics / KPI Row -->
          <section class="grid grid-cols-1 md:grid-cols-4 gap-4" id="complaints-metrics">
            <!-- Rendered via JS -->
          </section>

          <section class="bg-white rounded-2xl border border-slate-200/80 premium-shadow flex flex-col overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4 bg-slate-50/50">
              <div class="relative w-full sm:w-72">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="complaints-search-input" placeholder="Search ID, Subject, or Customer..." class="w-full pl-9 pr-4 py-2 text-xs font-semibold text-slate-800 bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500" oninput="window.renderTable()">
              </div>
              <div class="flex items-center gap-2 w-full sm:w-auto">
                <select id="complaints-filter-status" class="w-full sm:w-auto px-3 py-2 text-xs font-semibold text-slate-700 bg-white border border-slate-200 rounded-lg focus:outline-none" onchange="window.renderTable()">
                  <option value="all">All Status</option>
                  <option value="Open">Open</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Resolved">Resolved</option>
                  <option value="Closed">Closed</option>
                </select>
                <select id="complaints-filter-priority" class="w-full sm:w-auto px-3 py-2 text-xs font-semibold text-slate-700 bg-white border border-slate-200 rounded-lg focus:outline-none" onchange="window.renderTable()">
                  <option value="all">All Priorities</option>
                  <option value="High">High</option>
                  <option value="Medium">Medium</option>
                  <option value="Low">Low</option>
                </select>
              </div>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs font-medium text-slate-600">
                <thead>
                  <tr class="bg-slate-50/80 border-b border-slate-100 text-[10px] uppercase font-bold text-slate-400/80 tracking-wider">
                    <th class="px-6 py-4">ID</th>
                    <th class="px-6 py-4"><span data-i18n="common.date">Date</span></th>
                    <th class="px-6 py-4">Customer</th>
                    <th class="px-6 py-4">Subject</th>
                    <th class="px-6 py-4 text-center">Priority</th>
                    <th class="px-6 py-4"><span data-i18n="common.status">Status</span></th>
                    <th class="px-6 py-4 text-center"><span data-i18n="common.actions">Actions</span></th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100" id="complaints-table-body">
                  <!-- JS Populated -->
                </tbody>
              </table>
            </div>
          </section>
        </div>

        <!-- Form View -->
        <div id="complaints-form-view" class="max-w-3xl mx-auto hidden flex flex-col gap-6 relative">
          <app-form-header 
            title-id="complaints-form-title" 
            title="Log Complaint" 
            subtitle="Record customer feedback or quality issues for resolution." 
            back-action="window.showMainView()">
          </app-form-header>

          <form id="complaints-form" onsubmit="window.handleSubmit(event)" class="flex flex-col gap-6">
            <input type="hidden" id="complaints-edit-id">
            
            <section class="bg-white rounded-2xl border border-slate-200/80 premium-shadow p-6 flex flex-col gap-5">
              <h3 class="text-sm font-bold text-slate-900 flex items-center gap-2 border-b border-slate-100 pb-3">
                <i data-lucide="user" class="w-4 h-4 text-purple-600"></i> Issue Details
              </h3>
              
              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <label class="flex flex-col gap-1.5">
                  <span class="text-[11px] font-bold text-slate-700">Customer <span class="text-red-500">*</span></span>
                  <select id="complaints-input-customer" required class="px-3 py-2.5 text-xs font-semibold text-slate-900 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20">
                    <!-- Populated via JS -->
                  </select>
                </label>
                <label class="flex flex-col gap-1.5">
                  <span class="text-[11px] font-bold text-slate-700">Date Logged <span class="text-red-500">*</span></span>
                  <input type="date" id="complaints-input-date" required class="px-3 py-2.5 text-xs font-semibold text-slate-900 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20">
                </label>
              </div>

              <label class="flex flex-col gap-1.5">
                <span class="text-[11px] font-bold text-slate-700">Subject <span class="text-red-500">*</span></span>
                <input type="text" id="complaints-input-subject" required class="px-3 py-2.5 text-xs font-semibold text-slate-900 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20" placeholder="E.g., Missing parts in shipment">
              </label>
              
              <label class="flex flex-col gap-1.5">
                <span class="text-[11px] font-bold text-slate-700">Description <span class="text-red-500">*</span></span>
                <textarea id="complaints-input-desc" required rows="4" class="px-3 py-2.5 text-xs font-semibold text-slate-900 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20" placeholder="Provide detailed information about the issue..."></textarea>
              </label>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <label class="flex flex-col gap-1.5">
                  <span class="text-[11px] font-bold text-slate-700">Priority</span>
                  <select id="complaints-input-priority" class="px-3 py-2.5 text-xs font-semibold text-slate-900 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                  </select>
                </label>
                <label class="flex flex-col gap-1.5">
                  <span class="text-[11px] font-bold text-slate-700">Status</span>
                  <select id="complaints-input-status" class="px-3 py-2.5 text-xs font-semibold text-slate-900 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20">
                    <option value="Open">Open</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Resolved">Resolved</option>
                    <option value="Closed">Closed</option>
                  </select>
                </label>
              </div>

              <div class="mt-4 p-4 bg-slate-50 border border-slate-200 rounded-xl">
                <label class="flex flex-col gap-1.5">
                  <span class="text-[11px] font-bold text-slate-700">Resolution Notes</span>
                  <textarea id="complaints-input-resolution" rows="3" class="px-3 py-2.5 text-xs font-semibold text-slate-900 bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20" placeholder="Record steps taken to resolve the issue..."></textarea>
                </label>
              </div>
            </section>

            <div class="flex items-center justify-end gap-3 pt-2">
              <button type="button" onclick="window.showMainView()" class="px-5 py-2.5 rounded-xl font-bold text-xs text-slate-600 bg-white border border-slate-200 hover:bg-slate-50 transition-colors shadow-sm cursor-pointer">Cancel</button>
              <button type="submit" class="px-6 py-2.5 rounded-xl font-bold text-xs text-white bg-purple-600 hover:bg-purple-700 shadow-md shadow-purple-500/20 transition-all cursor-pointer">Save Complaint</button>
            </div>
          </form>
        </div>

        <app-footer></app-footer>
      </div>
    </main>
  </div>

</body>
</html>

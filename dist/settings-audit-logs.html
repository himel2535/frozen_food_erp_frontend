<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Logs — Toys Factory ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/settings-audit-logs-zWBpaO5F.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/lucide-CU5-AOMs.js">
  <link rel="modulepreload" crossorigin href="/assets/shared-Det_SasC.js">
  <link rel="modulepreload" crossorigin href="/assets/layout-wQjH3XYy.js">
  <link rel="stylesheet" crossorigin href="/assets/lucide-bglkidLV.css">
</head>
<body class="bg-slate-50 font-['Inter'] antialiased text-slate-600">
  <div id="screen-workspace" class="min-h-screen flex">
    <app-sidebar mode="tenant"></app-sidebar>
    <main class="flex-1 flex flex-col min-h-screen overflow-hidden">
      <app-header mode="tenant" title="Settings"></app-header>

      <div id="settings-audit-logs-main-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 flex flex-col">
        <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4">
          <div>
            <h2 class="text-xl font-extrabold text-slate-900 tracking-tight"><span data-i18n="settings.audit_title">System Audit Logs</span></h2>
            <p class="text-xs text-slate-500 mt-1 font-medium">Read-only logs tracking all user activity and system events.</p>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <button class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-4 py-2.5 rounded-xl transition-all flex items-center gap-2 cursor-pointer">
              <i data-lucide="download" class="w-4 h-4"></i> Export Logs
            </button>
          </div>
        </div>

        <div class="bg-white p-4 rounded-2xl border border-slate-200/80 premium-shadow space-y-4">
          <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-3">
            <div class="text-xs text-slate-500 font-semibold">Filter by user, module, or event type.</div>
            <div class="relative min-w-[240px]">
              <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
              <input type="text" id="settings-audit-logs-search-input" oninput="window.renderTable()" placeholder="Search logs..." class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all font-medium">
            </div>
          </div>
        </div>

        <!-- Table View -->
        <section id="settings-audit-logs-panel-list" class="space-y-4">
          <div class="bg-white rounded-2xl border border-slate-200/80 premium-shadow overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs border-collapse">
                <thead>
                  <tr class="bg-slate-50 text-slate-500 border-b border-slate-100 font-bold uppercase tracking-wider text-[10px]">
                    <th class="p-4 pl-6">Timestamp</th>
                    <th class="p-4">User</th>
                    <th class="p-4">Event Type</th>
                    <th class="p-4">Module</th>
                    <th class="p-4">Description</th>
                    <th class="p-4 text-right">IP Address</th>
                  </tr>
                </thead>
                <tbody id="settings-audit-logs-body" class="divide-y divide-slate-100 font-medium text-slate-700">
                  <!-- Rendered by JS -->
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </div>

    </main>
  </div>

</body>
</html>

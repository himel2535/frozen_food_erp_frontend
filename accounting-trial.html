<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trial Balance — Toys Factory ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 font-['Inter'] antialiased text-slate-600">
  <div id="screen-workspace" class="min-h-screen flex">
    <app-sidebar mode="tenant"></app-sidebar>
    <main class="flex-1 flex flex-col min-h-screen overflow-hidden">
      <app-header mode="tenant" title="Enterprise Workspace"></app-header>

      <div id="accounting-trial-main-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 flex flex-col">
        <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4">
          <div>
            <h2 class="text-xl font-extrabold text-slate-900 tracking-tight"><span data-i18n="accounting.trial_title">Trial Balance Master</span></h2>
            <p class="text-xs text-slate-500 mt-1 font-medium">Manage and track your business trial balance lifecycle.</p>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <button onclick="window.openTrialModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/10 flex items-center gap-2">
              <i data-lucide="plus" class="w-4 h-4"></i> Add Trial
            </button>
          </div>
        </div>

        <!-- Metrics Section -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="accounting-trial-metrics">
          <!-- Populated by JS -->
        </div>

        <!-- Filter Bar -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200/80 premium-shadow space-y-4">
          <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-3">
            <div class="text-xs text-slate-500 font-semibold">Filter and search operations.</div>
            <div class="relative min-w-[240px]">
              <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
              <input type="text" id="accounting-trial-search-input" oninput="window.renderTable()" placeholder="Search..." class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all font-medium">
            </div>
          </div>
        </div>

        <!-- Table View -->
        <section id="accounting-trial-panel-list" class="space-y-4">
          <div class="bg-white p-4 rounded-2xl border border-slate-200/80 premium-shadow space-y-4">
            <div class="overflow-x-auto rounded-xl border border-slate-100">
              <table class="w-full text-left text-xs border-collapse">
                <thead>
                  <tr class="bg-slate-50 text-slate-500 border-b border-slate-100 font-bold">
                    <th class="p-4">Account</th>
                    <th class="p-4">Debit Balance</th>
                    <th class="p-4">Credit Balance</th>
                  </tr>
                </thead>
                <tbody id="accounting-trial-body" class="divide-y divide-slate-100 font-medium text-slate-700">
                  <!-- Rendered by JS -->
                </tbody>
              </table>
            </div>
          </div>
        </section>

        <app-footer></app-footer>
      </div>

      <!-- Inline Form View -->
      <div id="accounting-trial-form-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 hidden bg-slate-50">
        <div class="max-w-4xl mx-auto w-full space-y-6">
          <app-form-header title="Create Trial" subtitle="Provide details below." back-action="window.showMainView()"></app-form-header>

          <form id="accounting-trial-form" onsubmit="window.handleSubmit(event)" class="bg-white rounded-2xl border border-slate-200 p-6 premium-shadow space-y-6 text-xs font-semibold text-slate-700">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div><label class="block mb-2">Account</label><input type="text" id="input-account" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none"></div>
              <div><label class="block mb-2">Debit Balance ($)</label><input type="number" step="0.01" id="input-debit" value="0" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none"></div>
              <div><label class="block mb-2">Credit Balance ($)</label><input type="number" step="0.01" id="input-credit" value="0" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none"></div>
            </div>

            <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
              <button type="button" onclick="window.showMainView()" class="border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold px-4 py-2.5 rounded-xl transition-all">Cancel</button>
              <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/10">Save Record</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/layout.js"></script>
  <script type="module" src="/js/shared.js"></script>
  <script type="module" src="/js/accounting-trial.js"></script>
</body>
</html>

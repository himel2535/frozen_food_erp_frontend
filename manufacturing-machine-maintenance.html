<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Machine Maintenance - Toys Factory ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 font-['Inter'] antialiased text-slate-600">
  <div id="screen-workspace" class="min-h-screen flex">
    <app-sidebar mode="tenant"></app-sidebar>
    <main class="flex-1 flex flex-col min-h-screen overflow-hidden">
      <app-header mode="tenant" title="Manufacturing"></app-header>
      <div class="flex-1 overflow-y-auto p-6 md:p-8">
        
        <!-- Main View (Table) -->
        <div id="machine-main-view" class="max-w-7xl mx-auto flex flex-col gap-6">
          <section class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h2 class="text-xl font-extrabold text-slate-900 tracking-tight"><span data-i18n="manufacturing.machines_title">Machine Maintenance</span></h2>
            </div>
            <div>
              <button onclick="window.openMachineModal()" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md flex items-center gap-2 cursor-pointer">
                <i data-lucide="plus" class="w-4 h-4"></i> <span data-i18n="common.add">Add</span>
              </button>
            </div>
          </section>
          <!-- Placeholder for table -->
          <div class="bg-white p-8 rounded-2xl border border-slate-200 text-center text-slate-500 text-sm" data-i18n="common.no_data">
            Machine Maintenance UI is being built.
          </div>
        </div>
        <app-footer></app-footer>
      </div>
    </main>
  </div>
  <script type="module" src="/layout.js"></script>
  <script type="module" src="/js/shared.js"></script>
</body>
</html>

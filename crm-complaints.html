<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Complaints — Toys Factory ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 font-['Inter'] antialiased text-slate-600">
  <div id="screen-workspace" class="min-h-screen flex">
    <app-sidebar mode="tenant"></app-sidebar>
    <main class="flex-1 flex flex-col min-h-screen overflow-hidden">
      <app-header mode="tenant" title="CRM"></app-header>

      <!-- Main View — Outlook-style mail layout -->
      <div id="complaints-main-view" class="flex-1 flex flex-col min-h-0 overflow-hidden">
        <div class="px-4 md:px-6 pt-4 pb-3 border-b border-slate-200 bg-white shrink-0 space-y-3">
          <div>
            <h2 class="text-lg font-extrabold text-slate-900 tracking-tight">Customer complaints</h2>
            <p class="text-xs text-slate-500 mt-0.5 font-medium">Track feedback, quality issues, and resolution like an inbox.</p>
          </div>

          <!-- Command bar -->
          <div class="flex flex-wrap items-center gap-2">
            <button type="button" onclick="window.openComplaintModal()" class="inline-flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-3 py-2 rounded-xl cursor-pointer">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> New
            </button>
            <button type="button" id="complaints-cmd-progress" onclick="window.markSelectedInProgress()" disabled class="inline-flex items-center gap-1.5 border border-slate-200 bg-slate-100 text-slate-400 text-xs font-semibold px-3 py-2 rounded-xl cursor-not-allowed">
              Mark in progress
            </button>
            <button type="button" id="complaints-cmd-resolve" onclick="window.resolveSelectedComplaint()" disabled class="inline-flex items-center gap-1.5 border border-slate-200 bg-slate-100 text-slate-400 text-xs font-semibold px-3 py-2 rounded-xl cursor-not-allowed">
              Resolve
            </button>
            <button type="button" id="complaints-cmd-edit" onclick="window.editSelectedComplaint()" disabled class="inline-flex items-center gap-1.5 border border-slate-200 bg-slate-100 text-slate-400 text-xs font-semibold px-3 py-2 rounded-xl cursor-not-allowed">
              Edit
            </button>
            <div class="relative flex-1 min-w-[180px] max-w-xs ml-auto">
              <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-400"></i>
              <input type="text" id="complaints-search-input" oninput="window.renderComplaints()" placeholder="Search ID, subject, or customer..." class="w-full pl-9 pr-3 py-2 text-xs font-medium bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/20">
            </div>
          </div>

          <!-- Mobile folder chips -->
          <div id="complaints-folder-chips" class="flex flex-wrap gap-1.5 lg:hidden"></div>
        </div>

        <!-- Three panes -->
        <div class="flex-1 flex min-h-0 overflow-hidden bg-white">
          <!-- Folder pane -->
          <aside id="complaints-folder-pane" class="hidden lg:flex w-[180px] shrink-0 flex-col border-r border-slate-200 bg-slate-50/80 overflow-y-auto p-2">
            <div class="px-2 py-2 text-[10px] font-bold text-slate-400 uppercase tracking-wider">Folders</div>
            <nav id="complaints-folder-list" class="flex flex-col gap-0.5"></nav>
          </aside>

          <!-- List pane -->
          <section id="complaints-list-pane" class="w-full lg:w-[340px] shrink-0 flex flex-col border-r border-slate-200 min-h-0">
            <div class="px-3 py-2 border-b border-slate-100 flex items-center justify-between shrink-0">
              <span class="text-[11px] font-bold text-slate-500" id="complaints-list-count">0 items</span>
            </div>
            <div id="complaints-list-body" class="flex-1 overflow-y-auto min-h-0"></div>
          </section>

          <!-- Reading pane -->
          <section id="complaints-reading-pane" class="hidden lg:flex flex-1 flex-col min-h-0 min-w-0 overflow-hidden">
            <div id="complaints-reading-empty" class="flex-1 flex flex-col items-center justify-center text-center p-8 text-slate-400">
              <i data-lucide="mail-open" class="w-10 h-10 mb-3 text-slate-300"></i>
              <p class="text-sm font-bold text-slate-500">Select a complaint</p>
              <p class="text-xs font-medium mt-1">Choose an item from the list to read details here.</p>
            </div>
            <div id="complaints-reading-content" class="hidden flex-1 flex flex-col min-h-0 overflow-y-auto p-5 md:p-6 space-y-4"></div>
          </section>
        </div>

        <!-- Mobile reading overlay -->
        <div id="complaints-reading-mobile" class="hidden fixed inset-0 z-40 lg:hidden bg-white flex flex-col">
          <div class="px-4 py-3 border-b border-slate-200 flex items-center gap-3 shrink-0">
            <button type="button" onclick="window.closeMobileReading()" class="border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold px-3 py-2 rounded-xl cursor-pointer">Back</button>
            <span class="text-xs font-bold text-slate-900 truncate">Complaint detail</span>
          </div>
          <div id="complaints-reading-mobile-body" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
        </div>
      </div>

      <!-- Form View -->
      <div id="complaints-form-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 hidden bg-slate-50">
        <div class="max-w-3xl mx-auto w-full space-y-6">
          <app-form-header
            title-id="complaints-form-title"
            title="Log complaint"
            subtitle="Record customer feedback or quality issues for resolution."
            back-action="window.showMainView()">
          </app-form-header>

          <form id="complaints-form" onsubmit="window.handleSubmit(event)" class="bg-white rounded-xl border border-slate-200 p-6 space-y-5">
            <input type="hidden" id="complaints-edit-id">

            <h3 class="text-sm font-bold text-slate-900 flex items-center gap-2 border-b border-slate-100 pb-3">
              <i data-lucide="user" class="w-4 h-4 text-blue-600"></i> Issue details
            </h3>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs font-semibold text-slate-700">
              <label class="flex flex-col gap-1.5">
                <span>Customer <span class="text-rose-500">*</span></span>
                <select id="complaints-input-customer" required class="px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-blue-500 cursor-pointer"></select>
              </label>
              <label class="flex flex-col gap-1.5">
                <span>Date logged <span class="text-rose-500">*</span></span>
                <input type="date" id="complaints-input-date" required class="px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-blue-500">
              </label>
            </div>

            <label class="flex flex-col gap-1.5 text-xs font-semibold text-slate-700">
              <span>Subject <span class="text-rose-500">*</span></span>
              <input type="text" id="complaints-input-subject" required class="px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-blue-500" placeholder="E.g., Missing parts in shipment">
            </label>

            <label class="flex flex-col gap-1.5 text-xs font-semibold text-slate-700">
              <span>Description <span class="text-rose-500">*</span></span>
              <textarea id="complaints-input-desc" required rows="4" class="px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-blue-500" placeholder="Provide detailed information about the issue..."></textarea>
            </label>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs font-semibold text-slate-700">
              <label class="flex flex-col gap-1.5">
                <span>Priority</span>
                <select id="complaints-input-priority" class="px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-blue-500 cursor-pointer">
                  <option value="Low">Low</option>
                  <option value="Medium" selected>Medium</option>
                  <option value="High">High</option>
                </select>
              </label>
              <label class="flex flex-col gap-1.5">
                <span>Status</span>
                <select id="complaints-input-status" class="px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-blue-500 cursor-pointer">
                  <option value="Open">Open</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Resolved">Resolved</option>
                  <option value="Closed">Closed</option>
                </select>
              </label>
            </div>

            <div>
              <button type="button" onclick="window.toggleAdvancedComplaintFields()" class="flex items-center gap-2 text-blue-600 hover:text-blue-700 text-xs font-bold cursor-pointer">
                <i data-lucide="chevron-down" id="complaints-advanced-icon" class="w-4 h-4 transition-transform"></i>
                Show advanced details
              </button>
            </div>
            <div id="complaints-advanced-section" class="hidden space-y-4 pt-4 border-t border-slate-100">
              <label class="flex flex-col gap-1.5 text-xs font-semibold text-slate-700">
                <span>Resolution notes</span>
                <textarea id="complaints-input-resolution" rows="3" class="px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:border-blue-500" placeholder="Record steps taken to resolve the issue..."></textarea>
              </label>
            </div>

            <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
              <button type="button" onclick="window.showMainView()" class="border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold px-4 py-2.5 rounded-xl cursor-pointer">Cancel</button>
              <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl cursor-pointer">Save complaint</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/layout.js"></script>
  <script type="module" src="/js/shared.js"></script>
  <script type="module" src="/js/crm-complaints.js"></script>
</body>
</html>

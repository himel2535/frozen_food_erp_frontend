<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Management — Toys Factory ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 font-['Inter'] antialiased text-slate-600">
  <div id="screen-workspace" class="min-h-screen flex">
    <app-sidebar mode="tenant"></app-sidebar>
    <main class="flex-1 flex flex-col min-h-screen overflow-hidden">
      <app-header mode="tenant" title="Settings"></app-header>
      <div class="flex-1 overflow-y-auto p-6 md:p-8">
        
        <!-- Main View -->
        <div id="docs-main-view" class="max-w-7xl mx-auto flex flex-col gap-6">
          <section class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h2 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight"><span data-i18n="settings.documents_title">Document Management</span></h2>
              <p class="text-xs text-slate-500 mt-1.5 font-medium">Store and organize SOPs, product drawings, and factory guidelines.</p>
            </div>
            <div class="flex items-center gap-3">
              <button onclick="window.openDocModal()" class="flex items-center gap-2 bg-indigo-600 text-white px-4 py-2.5 rounded-xl font-bold text-xs shadow-sm hover:bg-indigo-700 transition-colors cursor-pointer">
                <i data-lucide="upload-cloud" class="w-4 h-4"></i> Upload Document
              </button>
            </div>
          </section>

          <!-- Metrics -->
          <section class="grid grid-cols-1 md:grid-cols-4 gap-4" id="docs-metrics">
            <!-- Rendered via JS -->
          </section>

          <section class="bg-white rounded-2xl border border-slate-200/80 premium-shadow flex flex-col overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4 bg-slate-50/50">
              <div class="relative w-full sm:w-72">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="docs-search-input" placeholder="Search title, product, or tags..." class="w-full pl-9 pr-4 py-2 text-xs font-semibold text-slate-800 bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" oninput="window.renderTable()">
              </div>
              <div class="flex items-center gap-2 w-full sm:w-auto">
                <select id="docs-filter-category" class="w-full sm:w-auto px-3 py-2 text-xs font-semibold text-slate-700 bg-white border border-slate-200 rounded-lg focus:outline-none" onchange="window.renderTable()">
                  <option value="all">All Categories</option>
                  <option value="SOP">SOP</option>
                  <option value="Product Drawing">Product Drawing</option>
                  <option value="Quality Standard">Quality Standard</option>
                  <option value="Other">Other</option>
                </select>
              </div>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs font-medium text-slate-600">
                <thead>
                  <tr class="bg-slate-50/80 border-b border-slate-100 text-[10px] uppercase font-bold text-slate-400/80 tracking-wider">
                    <th class="px-6 py-4">Document Title</th>
                    <th class="px-6 py-4"><span data-i18n="common.category">Category</span></th>
                    <th class="px-6 py-4">Linked Product</th>
                    <th class="px-6 py-4">Upload Date</th>
                    <th class="px-6 py-4 text-center">Version</th>
                    <th class="px-6 py-4 text-center"><span data-i18n="common.actions">Actions</span></th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100" id="docs-table-body">
                  <!-- JS Populated -->
                </tbody>
              </table>
            </div>
          </section>
        </div>

        <!-- Form View -->
        <div id="docs-form-view" class="max-w-2xl mx-auto hidden flex flex-col gap-6 relative">
          <app-form-header 
            title-id="docs-form-title" 
            title="Upload Document" 
            subtitle="Add a new SOP, drawing, or guideline to the repository." 
            back-action="window.showMainView()">
          </app-form-header>

          <form id="docs-form" onsubmit="window.handleSubmit(event)" class="flex flex-col gap-6">
            <input type="hidden" id="docs-edit-id">
            
            <section class="bg-white rounded-2xl border border-slate-200/80 premium-shadow p-6 flex flex-col gap-5">
              <h3 class="text-sm font-bold text-slate-900 flex items-center gap-2 border-b border-slate-100 pb-3">
                <i data-lucide="file-text" class="w-4 h-4 text-indigo-600"></i> Document Details
              </h3>
              
              <label class="flex flex-col gap-1.5">
                <span class="text-[11px] font-bold text-slate-700">Document Title <span class="text-red-500">*</span></span>
                <input type="text" id="docs-input-title" required class="px-3 py-2.5 text-xs font-semibold text-slate-900 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" placeholder="E.g., RC Car Motor Assembly SOP">
              </label>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <label class="flex flex-col gap-1.5">
                  <span class="text-[11px] font-bold text-slate-700">Category <span class="text-red-500">*</span></span>
                  <select id="docs-input-category" required class="px-3 py-2.5 text-xs font-semibold text-slate-900 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20">
                    <option value="SOP">SOP (Standard Operating Procedure)</option>
                    <option value="Product Drawing">Product Drawing / CAD</option>
                    <option value="Quality Standard">Quality Standard</option>
                    <option value="Other">Other</option>
                  </select>
                </label>
                <label class="flex flex-col gap-1.5">
                  <span class="text-[11px] font-bold text-slate-700">Version</span>
                  <input type="text" id="docs-input-version" value="v1.0" class="px-3 py-2.5 text-xs font-semibold text-slate-900 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20">
                </label>
              </div>
              
              <label class="flex flex-col gap-1.5">
                <span class="text-[11px] font-bold text-slate-700">Linked Product (Optional)</span>
                <select id="docs-input-product" class="px-3 py-2.5 text-xs font-semibold text-slate-900 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20">
                  <!-- Populated via JS -->
                </select>
              </label>

              <label class="flex flex-col gap-1.5">
                <span class="text-[11px] font-bold text-slate-700">Description / Keywords</span>
                <textarea id="docs-input-desc" rows="3" class="px-3 py-2.5 text-xs font-semibold text-slate-900 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" placeholder="Brief description or keywords for searching..."></textarea>
              </label>

              <label class="flex flex-col gap-1.5 p-5 border-2 border-dashed border-indigo-200 rounded-xl bg-indigo-50/30 items-center justify-center text-center cursor-pointer hover:bg-indigo-50 transition-colors">
                <i data-lucide="upload" class="w-6 h-6 text-indigo-400 mb-2"></i>
                <span class="text-xs font-bold text-indigo-700">Click to upload or drag & drop</span>
                <span class="text-[10px] text-slate-500">PDF, JPG, PNG, DOCX (Max 10MB)</span>
                <input type="file" id="docs-input-file" class="hidden">
              </label>
              <div id="docs-file-name" class="text-[11px] font-bold text-indigo-600 text-center hidden"></div>
            </section>

            <div class="flex items-center justify-end gap-3 pt-2">
              <button type="button" onclick="window.showMainView()" class="px-5 py-2.5 rounded-xl font-bold text-xs text-slate-600 bg-white border border-slate-200 hover:bg-slate-50 transition-colors shadow-sm cursor-pointer">Cancel</button>
              <button type="submit" class="px-6 py-2.5 rounded-xl font-bold text-xs text-white bg-indigo-600 hover:bg-indigo-700 shadow-md shadow-indigo-500/20 transition-all cursor-pointer">Save Document</button>
            </div>
          </form>
        </div>

        <app-footer></app-footer>
      </div>
    </main>
  </div>

  <script type="module" src="/layout.js"></script>
  <script type="module" src="/js/shared.js"></script>
  <script type="module" src="/js/settings-documents.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Toys Factory ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 font-['Inter'] antialiased text-slate-600">
  <div id="screen-workspace" class="min-h-screen flex">
    <app-sidebar mode="tenant"></app-sidebar>
    <main class="flex-1 flex flex-col min-h-screen overflow-hidden">
      <app-header mode="tenant" title="Enterprise Workspace"></app-header>
      <div id="projects-main-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 flex flex-col">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h2 class="text-xl font-extrabold text-slate-900 tracking-tight"><span data-i18n="projects.title">Projects & Timelines</span></h2>
              <p class="text-xs text-slate-500 mt-1 font-medium">Coordinate client projects, task checklists, and resource assignments.</p>
            </div>
            <button onclick="window.toggleModal('modal-add-project', true)" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/10 flex items-center gap-2">
              <i data-lucide="plus" class="w-4 h-4"></i> Create Project
            </button>
          </div>

          <!-- Metrics -->
          <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 premium-shadow">
              <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Active Projects</span>
              <span class="text-xl font-extrabold text-blue-600 block mt-2" id="projects-metric-active">0</span>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 premium-shadow">
              <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">At Risk Milestones</span>
              <span class="text-xl font-extrabold text-rose-600 block mt-2" id="projects-metric-risk">0</span>
            </div>
          </div>

          <!-- Project progress list -->
          <div class="premium-card premium-shadow overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs font-medium text-slate-650">
                <thead>
                  <tr class="bg-slate-50/80 border-b border-slate-200/80 text-[10px] uppercase font-bold text-slate-400/80">
                    <th class="px-6 py-4">Project Name</th>
                    <th class="px-6 py-4">Project Lead</th>
                    <th class="px-6 py-4">Timeline Deadline</th>
                    <th class="px-6 py-4">Progress</th>
                    <th class="px-6 py-4">Health Status</th>
                    <th class="px-6 py-4 text-right">Project Budget</th>
                    <th class="px-6 py-4 text-center"><span data-i18n="common.actions">Actions</span></th>
                  </tr>
                </thead>
                <tbody id="projects-table-body" class="divide-y divide-slate-100">
                  <!-- Rendered dynamically -->
                </tbody>
              </table>
            </div>
          </div>

        <app-footer></app-footer>
      </div>
    <div id="projects-form-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 hidden bg-slate-50">
    <div class="max-w-2xl mx-auto w-full space-y-6">
            <app-form-header title="Launch New Project" subtitle="Create a new project and assign a lead." back-action="window.showProjectsMainView()"></app-form-header>
      <form id="projects-form" onsubmit="window.handleProjectSubmit(event)" class="bg-white rounded-2xl border border-slate-200 p-6 premium-shadow space-y-6 text-xs font-semibold text-slate-700">
        <div class="space-y-4">
          <div><label class="block mb-2">Project Name</label><input type="text" id="project-input-name" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none"></div>
          <div><label class="block mb-2">Project Lead</label><select id="project-input-lead" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none"></select></div>
          <div class="grid grid-cols-2 gap-4">
            <div><label class="block mb-2">Deadline Date</label><input type="date" id="project-input-deadline" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none"></div>
            <div><label class="block mb-2">Budget Allocation ($)</label><input type="number" id="project-input-budget" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none"></div>
          </div>
        </div>
        
        <div>
          <button type="button" onclick="window.toggleAdvancedProjectsFields()" class="flex items-center gap-2 text-blue-600 hover:text-blue-700 font-bold transition-colors">
            <i data-lucide="chevron-down" id="projects-advanced-icon" class="w-4 h-4 transition-transform"></i>
            Show Advanced Details
          </button>
        </div>
        
        <div id="projects-advanced-section" class="hidden space-y-6 pt-4 border-t border-slate-100">
          <div class="grid grid-cols-1 gap-4">
            <div><label class="block mb-2">Client / Sponsor</label><input type="text" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none"></div>
            <div><label class="block mb-2">Milestones</label><textarea rows="2" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none" placeholder="Phase 1: Concept, Phase 2: Execution..."></textarea></div>
          </div>
        </div>
        
        <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
          <button type="button" onclick="window.showProjectsMainView()" class="border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold px-4 py-2.5 rounded-xl transition-all">Cancel</button>
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/10">Deploy Project</button>
        </div>
      </form>
    </div>
  </div>
    </main>
  </div>

  

  
  

  <script type="module" src="/layout.js"></script>
  <script type="module" src="/js/shared.js"></script>
  <script type="module" src="/js/projects.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purchase Returns — Toys Factory ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 font-['Inter'] antialiased text-slate-600">
  <div id="screen-workspace" class="min-h-screen flex">
    <app-sidebar mode="tenant"></app-sidebar>
    <main class="flex-1 flex flex-col min-h-screen overflow-hidden">
      <app-header mode="tenant" title="Enterprise Workspace"></app-header>

      <!-- List View -->
      <div id="purchases-returns-main-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 flex flex-col justify-between">
        <div class="space-y-6">
          <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4">
            <div>
              <h2 class="text-xl font-extrabold text-slate-900 tracking-tight"><span data-i18n="purchases.returns_title">Purchase Returns Master</span></h2>
              <p class="text-xs text-slate-500 mt-1 font-medium">Manage and track your business raw material returns and refunds lifecycle.</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button onclick="window.openReturnModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/10 flex items-center gap-2 cursor-pointer">
                <i data-lucide="plus" class="w-4 h-4"></i> Add Purchase Return
              </button>
            </div>
          </div>

          <!-- Metrics Widgets -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="purchases-returns-metrics">
            <!-- Populated dynamically -->
          </div>

          <!-- Filters & Search Bar -->
          <div class="bg-white p-4 rounded-2xl border border-slate-200/80 premium-shadow space-y-4">
            <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-3">
              <div class="text-xs text-slate-500 font-semibold">Filter and search returns.</div>
              <div class="relative min-w-[240px] w-full xl:w-auto">
                <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="purchases-returns-search-input" oninput="window.renderTable()" placeholder="Search Return ID, Supplier, PO Ref..." class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all font-medium">
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
              <select id="filter-supplier" onchange="window.renderTable()" class="bg-slate-50 border border-slate-200 text-xs font-semibold text-slate-700 rounded-xl px-3 py-2 focus:outline-none cursor-pointer">
                <option value="all">All Suppliers</option>
              </select>
              <select id="filter-status" onchange="window.renderTable()" class="bg-slate-50 border border-slate-200 text-xs font-semibold text-slate-700 rounded-xl px-3 py-2 focus:outline-none cursor-pointer">
                <option value="all">All Statuses</option>
                <option value="Draft">Draft</option>
                <option value="Dispatched">Dispatched (Outbound)</option>
                <option value="Resolved">Resolved (Refunded)</option>
                <option value="Cancelled">Cancelled</option>
              </select>
              <div class="flex items-center gap-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
                <span class="text-[10px] text-slate-400 font-bold uppercase whitespace-nowrap">From:</span>
                <input type="date" id="filter-date-start" onchange="window.renderTable()" class="bg-transparent border-none text-xs font-semibold text-slate-700 w-full focus:outline-none">
              </div>
              <div class="flex items-center gap-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
                <span class="text-[10px] text-slate-400 font-bold uppercase whitespace-nowrap">To:</span>
                <input type="date" id="filter-date-end" onchange="window.renderTable()" class="bg-transparent border-none text-xs font-semibold text-slate-700 w-full focus:outline-none">
              </div>
            </div>
          </div>

          <!-- Returns Table View -->
          <section id="purchases-returns-panel-list" class="space-y-4">
            <div class="bg-white p-0 rounded-2xl border border-slate-200/80 premium-shadow overflow-hidden">
              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr class="bg-slate-50/85 text-slate-400 border-b border-slate-100 font-bold uppercase text-[10px] tracking-wider">
                      <th class="p-4 pl-6">Return ID</th>
                      <th class="p-4">Supplier</th>
                      <th class="p-4">Linked PO</th>
                      <th class="p-4 text-center">Return Qty</th>
                      <th class="p-4 text-right">Refund Value</th>
                      <th class="p-4">Reason</th>
                      <th class="p-4"><span data-i18n="common.date">Date</span></th>
                      <th class="p-4 text-center"><span data-i18n="common.status">Status</span></th>
                      <th class="p-4 text-center"><span data-i18n="common.actions">Actions</span></th>
                    </tr>
                  </thead>
                  <tbody id="purchases-returns-body" class="divide-y divide-slate-100 font-medium text-slate-700">
                    <!-- Rendered dynamically -->
                  </tbody>
                </table>
              </div>
            </div>
          </section>
        </div>

        <app-footer></app-footer>
      </div>

      <!-- Inline form view: Add/Edit return records -->
      <div id="purchases-returns-form-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 hidden bg-slate-50">
        <div class="max-w-3xl mx-auto w-full space-y-6">
          <app-form-header title-id="return-form-title" title="Create Purchase Return" subtitle="Create or edit supplier outbound return logistics details." back-action="window.showMainView()"></app-form-header>

          <form id="purchases-returns-form" onsubmit="window.handleSubmit(event)" class="bg-white rounded-2xl border border-slate-200 p-6 premium-shadow space-y-6 text-xs font-semibold text-slate-700">
            
            <!-- Basic Details -->
            <div class="space-y-4">
              <h3 class="text-sm font-bold text-slate-900 border-b border-slate-100 pb-2">Return Overview</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label class="block mb-2">Supplier *</label>
                  <select id="input-supp" required onchange="window.handleSupplierChange()" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none cursor-pointer">
                    <option value="">Select Supplier</option>
                  </select>
                </div>
                <div>
                  <label class="block mb-2">Link Purchase Order *</label>
                  <select id="input-po-ref" required onchange="window.handlePOChange()" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none cursor-pointer">
                    <option value="">Select Purchase Order</option>
                  </select>
                </div>
                <div>
                  <label class="block mb-2">Return Date *</label>
                  <input type="date" id="input-date" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none">
                </div>
                <div>
                  <label class="block mb-2">Return Reason *</label>
                  <select id="input-reason" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none cursor-pointer">
                    <option value="Damaged Goods">Damaged Goods</option>
                    <option value="Wrong Specifications">Wrong Specifications</option>
                    <option value="Excess Material Delivered">Excess Material Delivered</option>
                    <option value="Quality Substandard">Quality Substandard</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Costing details -->
            <div class="space-y-4">
              <h3 class="text-sm font-bold text-slate-900 border-b border-slate-100 pb-2">Return Quantities & Refunds</h3>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                  <label class="block mb-2">Return Quantity *</label>
                  <input type="number" min="1" id="input-qty" required oninput="window.calculateRefund()" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none">
                </div>
                <div>
                  <label class="block mb-2">Unit Refund Value ($) *</label>
                  <input type="number" step="0.01" min="0" id="input-unit-refund" required oninput="window.calculateRefund()" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none">
                </div>
                <div>
                  <label class="block mb-2">Total Refund Value ($)</label>
                  <input type="text" id="input-amount" readonly class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-100 text-xs text-slate-500 font-bold focus:outline-none">
                </div>
              </div>
            </div>

            <!-- Advanced details Collapsible -->
            <div class="space-y-4 pt-2">
              <div>
                <button type="button" onclick="window.toggleAdvancedFields()" class="flex items-center gap-2 text-blue-600 hover:text-blue-700 text-xs font-bold transition-colors cursor-pointer">
                  <i data-lucide="chevron-down" id="return-advanced-icon" class="w-4 h-4 transition-transform"></i>
                  Show Advanced Details
                </button>
              </div>
              <div id="return-advanced-section" class="hidden space-y-6 pt-4 border-t border-slate-100">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div>
                    <label class="block mb-2">Outbound Dispatch Date</label>
                    <input type="date" id="input-dispatch-date" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none">
                  </div>
                  <div>
                    <label class="block mb-2">Courier / Carrier Name</label>
                    <input type="text" id="input-carrier" placeholder="e.g. DHL, FedEx" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none">
                  </div>
                  <div>
                    <label class="block mb-2">Outbound Tracking ID</label>
                    <input type="text" id="input-tracking" placeholder="e.g. TRK908123" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none">
                  </div>
                  <div class="md:col-span-3">
                    <label class="block mb-2">Return Shipping Notes</label>
                    <textarea id="input-notes" placeholder="RMA details, warehouse restocking verification logs..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none h-14 resize-y"></textarea>
                  </div>
                </div>
              </div>
            </div>

            <!-- Form Actions -->
            <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
              <button type="button" onclick="window.showMainView()" class="border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold px-4 py-2.5 rounded-xl transition-all cursor-pointer">Cancel</button>
              <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/10 cursor-pointer">Save Record</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/layout.js"></script>
  <script type="module" src="/js/shared.js"></script>
  <script type="module" src="/js/purchases-returns.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Units Master - Toys Factory ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 font-['Inter'] antialiased text-slate-600">
  <div id="screen-workspace" class="min-h-screen flex">
    <app-sidebar mode="tenant"></app-sidebar>
    <main class="flex-1 flex flex-col min-h-screen overflow-hidden">
      <app-header mode="tenant" title="Enterprise Workspace"></app-header>

      <div id="inventory-units-main-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 flex flex-col">
        <div class="space-y-6">
          <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4">
            <div>
              <h2 class="text-xl font-extrabold text-slate-900 tracking-tight"><span data-i18n="sidebar.units">Units Master</span></h2>
              <p class="text-xs text-slate-500 mt-1 font-medium">Define units of measure used across products, stock, and production.</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button onclick="window.openInventoryUnitForm()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/10 flex items-center gap-2 cursor-pointer">
                <i data-lucide="plus" class="w-4 h-4"></i> Add Unit
              </button>
            </div>
          </div>

          <div id="inventory-units-metrics" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
            <!-- Rendered by JS -->
          </div>

          <div class="bg-white p-4 rounded-2xl border border-slate-200/80 premium-shadow">
            <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-3">
              <div class="text-xs text-slate-500 font-semibold">Search by unit id, code, name, symbol, or status.</div>
              <div class="relative min-w-[280px]">
                <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="inventory-units-search-input" oninput="window.renderInventoryUnitsTable()" placeholder="Search units..." class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all font-medium">
              </div>
            </div>
          </div>

          <section class="premium-card premium-shadow overflow-hidden bg-white border border-slate-200 rounded-2xl">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs border-collapse">
                <thead>
                  <tr class="bg-slate-50/80 border-b border-slate-200/80 text-[10px] uppercase font-bold text-slate-400/80">
                    <th class="px-6 py-4">Unit ID</th>
                    <th class="px-6 py-4">Code</th>
                    <th class="px-6 py-4"><span data-i18n="common.name">Name</span></th>
                    <th class="px-6 py-4">Symbol</th>
                    <th class="px-6 py-4">Description</th>
                    <th class="px-6 py-4 text-center">Products Using</th>
                    <th class="px-6 py-4"><span data-i18n="common.status">Status</span></th>
                    <th class="px-6 py-4 text-center"><span data-i18n="common.actions">Actions</span></th>
                  </tr>
                </thead>
                <tbody id="inventory-units-body" class="divide-y divide-slate-100 font-medium text-slate-700">
                  <!-- Rendered by JS -->
                </tbody>
              </table>
            </div>
          </section>
        </div>

        <app-footer></app-footer>
      </div>

      <div id="inventory-units-form-view" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6 hidden bg-slate-50">
        <div class="max-w-3xl mx-auto w-full space-y-6">
          <app-form-header title-id="inventory-unit-form-title" title="Create Unit" subtitle="Add a unit of measure for products and stock." back-action="window.showInventoryUnitsMainView()"></app-form-header>

          <form id="inventory-units-form" onsubmit="window.handleInventoryUnitSubmit(event)" class="bg-white rounded-2xl border border-slate-200 p-6 premium-shadow space-y-6 text-xs font-semibold text-slate-700">
            <input type="hidden" id="inventory-unit-edit-id">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block mb-2">Unit Name <span class="text-rose-500">*</span></label>
                <input type="text" id="inventory-unit-name" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all" placeholder="e.g. Kilogram">
              </div>
              <div>
                <label class="block mb-2">Unit Code <span class="text-rose-500">*</span></label>
                <input type="text" id="inventory-unit-code" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all" placeholder="e.g. kg">
              </div>
              <div>
                <label class="block mb-2">Symbol</label>
                <input type="text" id="inventory-unit-symbol" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all" placeholder="e.g. kg">
              </div>
              <div>
                <label class="block mb-2">Status <span class="text-rose-500">*</span></label>
                <select id="inventory-unit-status" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all cursor-pointer">
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                </select>
              </div>
              <div class="md:col-span-2">
                <label class="block mb-2">Description</label>
                <textarea id="inventory-unit-description" rows="3" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all font-medium"></textarea>
              </div>
            </div>

            <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
              <button type="button" onclick="window.showInventoryUnitsMainView()" class="border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold px-4 py-2.5 rounded-xl transition-all cursor-pointer">Cancel</button>
              <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/10 cursor-pointer">Save Unit</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/layout.js"></script>
  <script type="module" src="/js/shared.js"></script>
  <script type="module" src="/js/inventory-units.js"></script>
</body>
</html>
